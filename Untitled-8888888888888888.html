<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Scuola Bar Borsa - Sistema Ordini in Coda</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at center, #1a0000 0%, #000000 100%); 
            color: #ffffff; margin: 0; padding: 30px; min-height: 100vh;
            overflow-x: hidden;
        }

        .main-layout { display: flex; gap: 30px; max-width: 1600px; margin: auto; }
        
        /* GESTIONALE (SINISTRA) */
        .left-panel { flex: 1.5; }
        
        /* MONITOR CUCINA (DESTRA) */
        .right-panel { 
            flex: 1; 
            background: rgba(0, 0, 0, 0.8); 
            border: 2px solid #00a6ff; 
            border-radius: 20px; 
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 166, 255, 0.2);
            height: 85vh;
            overflow-y: auto;
        }

        .header {
            text-align: center; padding: 20px; border: 2px solid #ff0000; 
            border-radius: 15px; margin-bottom: 25px; box-shadow: 0 0 15px rgba(255,0,0,0.3);
        }
        h1 { color: #00c8ff; margin: 0; text-transform: uppercase; letter-spacing: 3px; font-size: 1.8em; }

        /* Form di inserimento */
        .add-box {
            background: #111; padding: 20px; border-radius: 15px; border: 1px solid #333;
            display: flex; gap: 10px; margin-bottom: 20px;
        }
        .add-box input { background: #000; border: 1px solid #00a6ff; color: white; padding: 12px; border-radius: 8px; flex: 1; }
        .btn-add { background: #00a6ff; color: #000; border: none; padding: 0 25px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-add:hover { background: #00ffaa; box-shadow: 0 0 15px #00ffaa; }

        /* Tabella Storico */
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        th { background: #00aaff; color: #000; padding: 12px; text-align: left; border-radius: 5px; font-size: 0.75em; text-transform: uppercase; }
        td { background: rgba(255,255,255,0.05); padding: 15px; border-top: 1px solid #333; border-bottom: 1px solid #333; }
        td:first-child { border-left: 1px solid #333; border-radius: 10px 0 0 10px; }
        td:last-child { border-right: 1px solid #333; border-radius: 0 10px 10px 0; }

        /* MONITOR ORDINI */
        .monitor-title { color: #00ffaa; text-align: center; text-transform: uppercase; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; }
        
        .order-card {
            background: linear-gradient(145deg, #111, #000); 
            border-left: 5px solid #ffaa00; 
            border-radius: 10px;
            padding: 20px; margin-bottom: 15px; 
            position: relative;
            animation: slideIn 0.4s ease forwards;
        }
        .order-name { color: #fff; font-weight: bold; font-size: 1.3em; display: block; margin-bottom: 10px; }
        
        .status-pill {
            display: inline-block; padding: 6px 12px; border-radius: 5px; font-size: 0.7em; font-weight: bold; text-transform: uppercase;
        }
        .prep { background: #ffaa00; color: #000; }
        .soon { background: #00a6ff; color: #000; }
        .done { background: #00ffaa; color: #000; }

        .controls { margin-top: 15px; display: flex; gap: 5px; }
        .controls button { background: #222; color: #eee; border: 1px solid #444; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.7em; }
        .controls button:hover { background: #333; border-color: #00a6ff; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

<div class="main-layout">
    
    <!-- PARTE SINISTRA -->
    <div class="left-panel">
        <div class="header">
            <h1>☕ SCUOLA BAR BORSA</h1>
        </div>

        <div class="add-box">
            <input type="text" id="nomeProd" placeholder="Inserisci Prodotto (es. Cappuccino)...">
            <input type="number" id="prezzoProd" placeholder="Prezzo €" style="max-width: 100px;">
            <button class="btn-add" onclick="creaOrdine()">INVIA ORDINE ⚡</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Storico Ordini</th>
                    <th>Prezzo</th>
                    <th>Orario</th>
                </tr>
            </thead>
            <tbody id="tabella-storico"></tbody>
        </table>
    </div>

    <!-- MONITOR (DESTRA) -->
    <div class="right-panel">
        <div class="monitor-title">🚀 CODA PREPARAZIONE</div>
        <div id="monitor-coda">
            <!-- Gli ordini si impileranno qui in ordine cronologico -->
        </div>
    </div>

</div>

<script>
    function creaOrdine() {
        const nome = document.getElementById('nomeProd').value;
        const prezzo = document.getElementById('prezzoProd').value || "0.00";
        const orario = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        if(!nome) return alert("Scrivi cosa preparare!");

        // 1. Aggiungi allo storico (Sinistra)
        const row = document.createElement('tr');
        row.innerHTML = `<td><b>${nome}</b></td><td>${prezzo} €</td><td><small>${orario}</small></td>`;
        document.getElementById('tabella-storico').prepend(row);

        // 2. Aggiungi alla coda (Destra)
        const idOrd = "id-" + Date.now();
        const card = document.createElement('div');
        card.className = 'order-card';
        card.id = idOrd;
        card.innerHTML = `
            <span class="order-name">${nome.toUpperCase()}</span>
            <span id="badge-${idOrd}" class="status-pill prep">In Preparazione</span>
            <div class="controls">
                <button onclick="updateStato('${idOrd}', 'soon')">Prossimo</button>
                <button onclick="updateStato('${idOrd}', 'done')">Pronto ✅</button>
            </div>
        `;
        document.getElementById('monitor-coda').appendChild(card); // appendChild lo mette in fondo alla coda

        // Pulisci input
        document.getElementById('nomeProd').value = "";
    }

    function updateStato(id, stato) {
        const badge = document.getElementById('badge-' + id);
        const card = document.getElementById(id);
        
        if(stato === 'soon') {
            badge.innerText = "Tra Poco";
            badge.className = "status-pill soon";
            card.style.borderLeftColor = "#00a6ff";
        } else if(stato === 'done') {
            badge.innerText = "Pronto";
            badge.className = "status-pill done";
            card.style.borderLeftColor = "#00ffaa";
            card.style.opacity = "0.5";
            // Rimuove l'ordine dalla coda dopo 4 secondi
            setTimeout(() => { card.style.display = "none"; }, 4000);
        }
    }
</script>

</body>
</html>
