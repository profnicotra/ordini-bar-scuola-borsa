<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menù V 3.0 TEST</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --neon-red: #ff3131;
        --neon-glow: rgba(255, 49, 49, 0.6);
        --bg-dark: #0a0a0a;
        --surface: rgba(10, 10, 10, 0.95);
        --error-color: #ff0000;
      }

      body {
        font-family: "Rajdhani", sans-serif;
        background: var(--bg-dark);
        color: #fff;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
      }

      canvas#sparks {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        background: radial-gradient(circle at 50% 50%, #2a0a0a 0%, #050505 100%);
      }

      .container {
        width: 95%;
        max-width: 1200px;
        margin-top: 40px;
        animation: fadeIn 0.8s ease;
        z-index: 1;
        padding-bottom: 100px;
      }

      h1 {
        font-family: "Orbitron";
        text-align: center;
        letter-spacing: 8px;
        text-shadow: 0 0 20px var(--neon-red);
        margin-bottom: 25px;
        color: white;
      }

      .category-nav {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 25px;
      }

      .cat-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid #333;
        color: #888;
        padding: 12px 25px;
        font-family: "Orbitron";
        font-size: 11px;
        cursor: pointer;
        transition: 0.3s;
        border-radius: 4px;
      }

      .cat-btn.active {
        border-color: var(--neon-red);
        color: var(--neon-red);
        box-shadow: 0 0 20px var(--neon-glow);
        background: rgba(255, 49, 49, 0.1);
      }

      .dashboard {
        background: var(--surface);
        border: 1px solid rgba(255, 49, 49, 0.3);
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(10px);
        margin-bottom: 40px;
      }

      table { width: 100%; border-collapse: collapse; }
      th {
        font-family: "Orbitron";
        color: var(--neon-red);
        font-size: 10px;
        padding: 15px;
        text-align: left;
        border-bottom: 2px solid var(--neon-red);
        text-transform: uppercase;
      }

      td { padding: 15px; border-bottom: 1px solid #222; font-size: 16px; }

      .notes-section {
        margin-top: 30px;
        border-top: 1px solid #333;
        padding-top: 20px;
      }

      .note-card {
        background: rgba(255, 255, 255, 0.02);
        border-left: 3px solid var(--neon-red);
        padding: 15px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
      }

      .modal {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 9999;
        justify-content: center;
        align-items: center;
      }
      .modal.active { display: flex; }
      
      .modal-content {
        background: #0f0f0f;
        border: 2px solid var(--neon-red);
        padding: 30px;
        width: 420px;
        border-radius: 10px;
        position: relative;
        box-shadow: 0 0 40px rgba(255, 49, 49, 0.2);
        transition: box-shadow 0.3s;
      }

      .input-error {
        border-color: var(--error-color) !important;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.5) !important;
        animation: shake 0.3s ease-in-out;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }

      .input-group { margin-bottom: 18px; }
      label { font-family: "Orbitron"; font-size: 9px; color: var(--neon-red); margin-bottom: 6px; display: block; }
      
      input, select {
        width: 100%; background: #000; border: 1px solid #333; color: #fff;
        padding: 12px; font-family: "Rajdhani"; font-size: 16px; border-radius: 4px; outline: none;
        box-sizing: border-box; transition: 0.3s;
      }

      .btn-plus-fixed {
        background: var(--neon-red);
        color: white; font-size: 28px; width: 60px; height: 60px;
        border-radius: 50%; position: fixed; bottom: 30px; right: 30px;
        box-shadow: 0 0 30px var(--neon-red); border: none; cursor: pointer;
        z-index: 100; transition: transform 0.2s;
      }
      .btn-plus-fixed:hover { transform: scale(1.1) rotate(90deg); }

      .btn {
        font-family: "Orbitron"; cursor: pointer; border: 1px solid var(--neon-red);
        background: transparent; color: var(--neon-red); padding: 6px 12px;
        font-size: 10px; border-radius: 3px; transition: 0.2s;
      }
      .btn:hover { background: var(--neon-red); color: white; box-shadow: 0 0 15px var(--neon-red); }

    </style>
  </head>
  <body>
    <canvas id="sparks"></canvas>

    <div class="container">
      <h1>MENÙ V 3.0 TEST</h1>

      <div class="category-nav">
        <button class="cat-btn active" onclick="filtra('CIBO', this)">CIBO</button>
        <button class="cat-btn" onclick="filtra('BEVANDE', this)">BEVANDE</button>
        <button class="cat-btn" onclick="filtra('SPECIALITÀ', this)">SPECIALITÀ</button>
      </div>

      <div class="dashboard">
        <table>
          <thead>
            <tr>
              <th>Prodotto</th>
              <th>Costo Unit.</th>
              <th>Listino €</th>
              <th>Margine</th>
              <th>Staff/Int.</th>
              <th style="text-align: right">SISTEMA</th>
            </tr>
          </thead>
          <tbody id="mainTable"></tbody>
        </table>
      </div>

      <div class="notes-section">
        <h2 style="font-family: 'Orbitron'; font-size: 14px; color: var(--neon-red); margin-bottom: 20px;">[ GRUPPI NOTE / VARIANTI ]</h2>
        <div id="notesContainer"></div>
      </div>
    </div>x

    <button class="btn-plus-fixed" onclick="apriModale()">+</button>

    <div id="modal" class="modal">
      <div id="modal-box" class="modal-content">
        <h2 style="font-family: 'Orbitron'; color: white; margin-top: 0; letter-spacing: 2px;">DIEGO TEST</h2>
        
        <div class="input-group">
          <label>Nome Prodotto</label>
          <input type="text" id="in-nome" oninput="autoDetectCategory()" placeholder="Esempio: Pizza Kebab" />
          <span id="auto-msg" style="font-size: 10px; color: #666; text-transform: uppercase;">Scanner in attesa...</span>
        </div>

        <div style="display: flex; gap: 10px">
          <div class="input-group" style="flex:1">
            <label>Costo Acquisto</label>
            <input type="number" id="in-costo" step="0.01" oninput="calcola()" />
          </div>
          <div class="input-group" style="flex:1">
            <label>Prezzo Vendita</label>
            <input type="number" id="in-prezzo" step="0.01" oninput="calcola()" />
          </div>
        </div>

        <div style="display: flex; gap: 10px">
          <div class="input-group" style="flex: 1">
            <label>Margine Lordo</label>
            <input type="text" id="in-margine" readonly style="color: #00ff00; font-weight: bold;" />
          </div>
          <div class="input-group" style="flex: 1">
            <label>Prezzo Staff</label>
            <input type="number" id="in-interni" step="0.01" />
          </div>
        </div>

        <div class="input-group">
          <label>Categoria Database</label>
          <select id="in-categoria">
            <option value="CIBO">CIBO</option>
            <option value="BEVANDE">BEVANDE</option>
            <option value="SPECIALITÀ">SPECIALITÀ</option>
          </select>
        </div>

        <button class="btn" style="width: 100%; padding: 15px; font-weight: bold; margin-top: 10px;" onclick="salva()">ESEGUI UPLOAD</button>
        <p onclick="chiudi()" style="text-align: center; cursor: pointer; color: #444; margin-top: 15px; font-family: 'Orbitron'; font-size: 10px;">[ ANNULLA_OPERAZIONE ]</p>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('sparks');
      const ctx = canvas.getContext('2d');
      let particles = [];
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      window.onresize = resize; resize();
      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2;
          this.speedY = Math.random() * 1 + 0.5;
          this.speedX = (Math.random() - 0.5) * 0.5;
          this.alpha = Math.random() * 0.5 + 0.2;
        }
        update() { this.y += this.speedY; this.x += this.speedX; if (this.y > canvas.height) this.reset(); }
        draw() {
          ctx.fillStyle = `rgba(255, 49, 49, ${this.alpha})`;
          ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      for(let i=0; i<80; i++) particles.push(new Particle());
      function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
      animate();

      let prodotti = JSON.parse(localStorage.getItem('cyber_menu_v3')) || [];
      let categoriaAttiva = "CIBO";
      let editId = null;

      function calcola() {
        const c = parseFloat(document.getElementById("in-costo").value) || 0;
        const p = parseFloat(document.getElementById("in-prezzo").value) || 0;
        const margEl = document.getElementById("in-margine");

        if (p > 0) {
          const m = ((p - c) / p) * 100;
          margEl.value = Math.round(m) + "%";
          document.getElementById("in-prezzo").classList.remove("input-error");
        } else {
          margEl.value = "0%";
        }
      }

      function salva() {
        const fields = [
            { id: "in-nome", val: document.getElementById("in-nome").value.trim() },
            { id: "in-prezzo", val: parseFloat(document.getElementById("in-prezzo").value) || 0 },
            { id: "in-costo", val: parseFloat(document.getElementById("in-costo").value) || 0 },
            { id: "in-interni", val: parseFloat(document.getElementById("in-interni").value) || 0 }
        ];

        let hasError = false;

        fields.forEach(f => {
            const el = document.getElementById(f.id);
            if (f.id === "in-nome") {
                if (!f.val) { el.classList.add("input-error"); hasError = true; } 
                else { el.classList.remove("input-error"); }
            } else {
                // Errore se il valore è 0 o vuoto
                if (f.val <= 0) { el.classList.add("input-error"); hasError = true; } 
                else { el.classList.remove("input-error"); }
            }
        });

        if (hasError) {
            const modalBox = document.getElementById("modal-box");
            modalBox.style.boxShadow = "0 0 60px #ff0000";
            setTimeout(() => { modalBox.style.boxShadow = "0 0 40px rgba(255, 49, 49, 0.2)"; }, 500);
          return;
        }

        const data = {
          id: editId || Date.now(),
          nome: document.getElementById("in-nome").value.trim(),
          costo: parseFloat(document.getElementById("in-costo").value),
          prezzo: parseFloat(document.getElementById("in-prezzo").value),
          margine: parseInt(document.getElementById("in-margine").value) || 0,
          interni: parseFloat(document.getElementById("in-interni").value),
          categoria: document.getElementById("in-categoria").value,
          stato: "ATTENDI" 
        };

        if (editId) {
          const i = prodotti.findIndex(x => x.id === editId);
          prodotti[i] = data;
        } else {
          prodotti.push(data);
        }

        localStorage.setItem('cyber_menu_v3', JSON.stringify(prodotti));
        render();
        chiudi();
      }

      function render() {
        const tableBody = document.getElementById("mainTable");
        const notesContainer = document.getElementById("notesContainer");
        
        tableBody.innerHTML = "";
        notesContainer.innerHTML = "";

        const filtrati = prodotti.filter(p => p.categoria === categoriaAttiva);
        
        filtrati.forEach(p => {
          // Render Tabella
          tableBody.innerHTML += `
            <tr>
              <td><b style="color:#eee">${p.nome}</b></td>
              <td style="color:#888">€${p.costo.toFixed(2)}</td>
              <td style="color:var(--neon-red); font-weight:bold; text-shadow: 0 0 10px var(--neon-glow)">€${p.prezzo.toFixed(2)}</td>
              <td style="color:#00ff00">${p.margine}%</td>
              <td>€${p.interni.toFixed(2)}</td>
              <td style="text-align: right;">
                <button class="btn" onclick="modifica(${p.id})">MOD</button>
                <button class="btn" style="border-color:#555; color:#888" onclick="elimina(${p.id})">X</button>
              </td>
            </tr>`;

          // Render Note / Varianti
          notesContainer.innerHTML += `
            <div class="note-card">
                <div>
                    <span style="color: #888; font-size: 10px; display: block;">PRODOTTO: ${p.nome}</span>
                    <b style="font-size: 18px; letter-spacing: 1px;">${p.stato}</b>
                </div>
                <div style="text-align: right">
                    <span style="color: var(--neon-red); font-weight: bold;">MODIFICA REGISTRATA</span><br>
                    <small style="color: #555;">CATEGORIA: ${p.categoria}</small>
                </div>
            </div>`;
        });
      }

      function filtra(cat, btn) {
        categoriaAttiva = cat;
        document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render();
      }

      function apriModale() {
        editId = null;
        document.querySelectorAll("input").forEach(i => {
            i.value = "";
            i.classList.remove("input-error");
        });
        document.getElementById("in-categoria").value = categoriaAttiva;
        document.getElementById("modal").classList.add("active");
        document.getElementById("in-nome").focus();
      }

      function modifica(id) {
        editId = id;
        const p = prodotti.find(x => x.id === id);
        document.getElementById("in-nome").value = p.nome;
        document.getElementById("in-costo").value = p.costo;
        document.getElementById("in-prezzo").value = p.prezzo;
        document.getElementById("in-margine").value = p.margine + "%";
        document.getElementById("in-interni").value = p.interni;
        document.getElementById("in-categoria").value = p.categoria;
        
        // Rimuovi errori precedenti se presenti
        document.querySelectorAll("input").forEach(i => i.classList.remove("input-error"));
        
        document.getElementById("modal").classList.add("active");
      }

      function elimina(id) {
        if(confirm("TERMINARE RECORD?")) {
            prodotti = prodotti.filter(x => x.id !== id);
            localStorage.setItem('cyber_menu_v3', JSON.stringify(prodotti));
            render();
        }
      }

      function autoDetectCategory() {
        const nome = document.getElementById("in-nome").value.toLowerCase();
        const catSelect = document.getElementById("in-categoria");
        const msg = document.getElementById("auto-msg");
        const bevande = ["coca", "acqua", "birra", "vino", "the", "drink", "gin", "succo", "bibita"];
        const cibo = ["pizza", "panino", "hamburger", "pasta", "fritto", "dolce", "kebab", "piadina"];

        let detected = "SPECIALITÀ";
        if (bevande.some(k => nome.includes(k))) detected = "BEVANDE";
        else if (cibo.some(k => nome.includes(k))) detected = "CIBO";

        catSelect.value = detected;
        msg.innerText = "SCANNER: " + detected;
        msg.style.color = detected === "SPECIALITÀ" ? "#666" : "var(--neon-red)";
      }

      function chiudi() { document.getElementById("modal").classList.remove("active"); }
      window.onload = render;

    </script>
  </body>
</html>
