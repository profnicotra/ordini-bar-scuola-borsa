<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Sala Bar - Scuola Borsa</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at center, #1a0000 0%, #000000 100%); 
            color: #ffffff; margin: 0; padding: 20px; min-height: 100vh;
            display: flex; gap: 20px; flex-wrap: wrap;
        }

        .container { flex: 2; min-width: 600px; }
        
        /* Sezione Ordini (Lista Comande) */
        .comanda-box { 
            flex: 1; min-width: 350px; background: rgba(20, 0, 0, 0.9); 
            border: 2px solid #ff4444; border-radius: 20px; padding: 20px;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.2); height: fit-content;
        }

        .header {
            text-align: center; padding: 20px; background: #000;
            border: 2px solid #00a6ff; border-radius: 20px; margin-bottom: 20px;
        }

        .header h1 { color: #00c8ff; margin: 0; font-size: 2em; letter-spacing: 4px; }
        .header .sub-title { font-size: 0.9em; opacity: 0.7; }

        /* Stile Tabelle */
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { background: #00aaff; color: #000; padding: 10px; font-size: 0.7em; }
        
        .info-row td { 
            background: #111; padding: 12px; border-top: 1px solid #00a6ff; cursor: pointer;
            transition: 0.2s;
        }
        .info-row:hover td { background: #1a1a1a; border-color: #fff; }

        .nome-prod { font-weight: bold; color: #00c8ff; }
        
        /* Stile Lista Ordine */
        .order-item { 
            background: #222; border: 1px solid #ff4444; border-radius: 10px; 
            padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px;
        }
        .order-top { display: flex; justify-content: space-between; align-items: center; }
        .order-actions button { background: none; border: none; cursor: pointer; font-size: 1.2em; }
        .edit-btn { color: #ffcc00; }
        .del-btn { color: #ff4444; }

        .allergy-text { 
            background: transparent; border: none; border-bottom: 1px dashed #555; 
            color: #ffaa00; font-size: 0.85em; width: 100%; outline: none; padding: 2px;
        }

        .add-box {
            background: #000; padding: 15px; border-radius: 15px; border: 1px solid #333;
            margin-bottom: 20px; display: flex; gap: 5px; flex-wrap: wrap;
        }
        .add-box input { background: #111; border: 1px solid #00a6ff; color: #fff; padding: 8px; border-radius: 5px; }

        .stato-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7em; font-weight: bold; }
        .stato-ok { color: #00ffaa; border: 1px solid #00ffaa; }
        .stato-no { color: #ff4444; border: 1px solid #ff4444; text-decoration: line-through; pointer-events: none; opacity: 0.5; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SALA BAR</h1>
        <div class="sub-title">Scuola Borsa</div>
    </div>

    <div class="add-box">
        <input type="text" id="n" placeholder="Nome">
        <input type="text" id="c" placeholder="Cat.">
        <input type="number" id="co" placeholder="Costo" step="0.01" style="width:70px">
        <input type="number" id="pr" placeholder="Prezzo" step="0.01" style="width:70px">
        <button onclick="aggiungiManuale()" style="background:#00a6ff; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer">AGGIUNGI +</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>PRODOTTO (Clicca per Ordinare)</th>
                <th>COSTO</th>
                <th>PREZZO</th>
                <th>STATO</th>
            </tr>
        </thead>
        <tbody id="lista-menu"></tbody>
    </table>
</div>

<div class="comanda-box">
    <h2 style="color:#ff4444; text-align:center; text-transform:uppercase; letter-spacing:2px">Ordine Attuale</h2>
    <div id="lista-ordine">
        <!-- Qui appaiono i prodotti cliccati -->
    </div>
    <div id="totale-ordine" style="text-align:right; font-weight:bold; border-top: 1px solid #ff4444; padding-top:10px; color:#fff">
        TOTALE: 0.00 €
    </div>
</div>

<script>
    const menuIniziale = [
        {n: "Caffè Espresso", c: "Caffetteria", co: 0.15, pr: 1.20, st: "DISPONIBILE"},
        {n: "Cappuccino", c: "Caffetteria", co: 0.35, pr: 1.80, st: "DISPONIBILE"},
        {n: "Tramezzino Crudo", c: "Salato", co: 1.20, pr: 4.00, st: "ESAURITO"}
    ];

    let totale = 0;

    function inserisciNelMenu(nome, cat, costo, prezzo, stato) {
        const corpo = document.getElementById('lista-menu');
        const sClass = stato === "DISPONIBILE" ? "stato-ok" : "stato-no";
        
        const riga = document.createElement('tr');
        riga.className = "info-row";
        riga.onclick = () => { if(stato === "DISPONIBILE") aggiungiAllOrdine(nome, prezzo); };
        
        riga.innerHTML = `
            <td><span class="nome-prod">${nome}</span><br><small style="color:#555">${cat}</small></td>
            <td style="color:#999">${costo.toFixed(2)} €</td>
            <td style="color:#fff; font-weight:bold">${prezzo.toFixed(2)} €</td>
            <td><span class="stato-badge ${sClass}">${stato}</span></td>
        `;
        corpo.appendChild(riga);
    }

    function aggiungiAllOrdine(nome, prezzo) {
        const listaOrdine = document.getElementById('lista-ordine');
        const itemId = 'item-' + Date.now();
        
        const div = document.createElement('div');
        div.className = "order-item";
        div.id = itemId;
        div.innerHTML = `
            <div class="order-top">
                <span style="font-weight:bold; color:#00c8ff">${nome}</span>
                <span style="font-family:monospace">${prezzo.toFixed(2)} €</span>
                <div class="order-actions">
                    <button class="edit-btn" onclick="focusNote('${itemId}')">✏️</button>
                    <button class="del-btn" onclick="rimuoviDallOrdine('${itemId}', ${prezzo})">🗑️</button>
                </div>
            </div>
            <input type="text" class="allergy-text" id="note-${itemId}" placeholder="Allergie o note speciali...">
        `;
        
        listaOrdine.appendChild(div);
        aggiornaTotale(prezzo);
    }

    function rimuoviDallOrdine(id, prezzo) {
        document.getElementById(id).remove();
        aggiornaTotale(-prezzo);
    }

    function focusNote(id) {
        document.getElementById('note-' + id).focus();
    }

    function aggiornaTotale(valore) {
        totale += valore;
        document.getElementById('totale-ordine').innerText = "TOTALE: " + Math.abs(totale).toFixed(2) + " €";
    }

    function aggiungiManuale() {
        const n = document.getElementById('n').value;
        const c = document.getElementById('c').value;
        const co = parseFloat(document.getElementById('co').value) || 0;
        const pr = parseFloat(document.getElementById('pr').value) || 0;
        if(!n) return;
        inserisciNelMenu(n, c, co, pr, "DISPONIBILE");
    }

    window.onload = () => {
        menuIniziale.forEach(p => inserisciNelMenu(p.n, p.c, p.co, p.pr, p.st));
    }
</script>

</body>
</html>
