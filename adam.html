<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; }
  
  .container { text-align: center; position: relative; }

  /* Animazione del cuore che pulsa e si muove */
  .heart {
    position: relative; width: 100px; height: 90px;
    background: #ff0000; display: inline-block;
    animation: pulse 0.8s infinite alternate, float 3s infinite ease-in-out;
    box-shadow: 0 0 40px #ff0000;
  }
  .heart:before, .heart:after {
    content: ""; position: absolute; top: 0; width: 100px; height: 150px;
    background: #ff0000; border-radius: 50px 50px 0 0;
  }
  .heart:before { left: 100px; transform: rotate(-45deg); transform-origin: 0 100%; }
  .heart:after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }

  .text { color: white; font-size: 25px; margin-top: 80px; text-shadow: 0 0 10px #ff0000; }

  @keyframes pulse {
    to { transform: scale(1.3); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-50px) translateX(20px); }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="heart"></div>
    <div class="text">CODICE 156: ATTIVO ❤️</div>
  </div>
</body>
</html>
