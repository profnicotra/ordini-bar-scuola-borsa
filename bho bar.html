<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Scuola Bar Borsa - Ordini</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com">
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at center, #1a0000 0%, #000000 100%); 
            color: #ffffff; margin: 0; padding: 40px 20px; min-height: 100vh;
        }

        .container { max-width: 1100px; margin: auto; transition: margin-right 0.3s; }

        .header {
            text-align: center; padding: 30px;
            background: linear-gradient(145deg, #330000 0%, #000000 100%);
            border: 2px solid #ff0000; border-radius: 20px; margin-bottom: 40px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }

        h1 { color: #ff0000; margin: 0; text-transform: uppercase; letter-spacing: 4px; }

        /* Tabella */
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        th { background: #ff0000; color: #000; padding: 15px; text-align: left; text-transform: uppercase; font-size: 0.8em; }
        td { background: #111; padding: 15px; border-top: 1px solid #300; border-bottom: 1px solid #300; }
        .nome-prod { font-weight: bold; color: #ff0000; display: block; }
        .val-euro { font-family: monospace; font-size: 1.1em; }

        /* Pulsanti */
        .btn-add {
            background: transparent; border: 1px solid #ff0000; color: #ff0000;
            padding: 8px 12px; border-radius: 5px; cursor: pointer; transition: 0.3s;
        }
        .btn-add:hover { background: #ff0000; color: #000; box-shadow: 0 0 10px #ff0000; }

        /* SIDEBAR CARRELLO */
        .cart-sidebar {
            position: fixed; right: -350px; top: 0; width: 300px; height: 100%;
            background: #000; border-left: 2px solid #ff0000;
            padding: 20px; transition: 0.3s; box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .cart-sidebar.active { right: 0; }
        .cart-title { color: #ff0000; border-bottom: 1px solid #300; padding-bottom: 10px; margin-bottom: 20px; }
        
        .cart-item { 
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; font-size: 0.9em; background: #111; padding: 10px; border-radius: 5px;
        }
        .btn-remove { color: #888; cursor: pointer; border: none; background: none; }
        .btn-remove:hover { color: #ff0000; }

        .cart-total { 
            position: absolute; bottom: 20px; width: 260px; border-top: 2px solid #ff0000; padding-top: 20px;
        }
        .btn-checkout {
            width: 100%; background: #ff0000; color: #000; border: none;
            padding: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; border-radius: 5px;
        }

        /* Icona carrello flottante */
        .cart-icon-fixed {
            position: fixed; top: 20px; right: 20px; background: #ff0000; color: #000;
            width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; cursor: pointer; z-index: 1001; font-size: 1.2em;
        }
    </style>
</head>
<body>

<div class="cart-icon-fixed" onclick="toggleCart()">
    <i class="fas fa-shopping-cart"></i>
</div>

<div class="cart-sidebar" id="sidebar">
    <h2 class="cart-title"><i class="fas fa-receipt"></i> IL TUO ORDINE</h2>
    <div id="cart-items-container">
        <!-- Qui appariranno i prodotti -->
    </div>
    <div class="cart-total">
        <h3>TOTALE: <span id="total-price">0.00</span> €</h3>
        <button class="btn-checkout">INVIA ORDINE</button>
    </div>
</div>

<div class="container" id="main-content">
    <div class="header">
        <h1>SCUOLA BAR BORSA</h1>
        <div style="color: #888; letter-spacing: 2px;">GESTIONE ORDINI & MARGINI</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>PRODOTTO</th>
                <th>PREZZO</th>
                <th>CATEGORIA</th>
                <th>ORDINA</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><span class="nome-prod">Caffè Espresso</span></td>
                <td class="val-euro">1.20 €</td>
                <td>Caffetteria</td>
                <td><button class="btn-add" onclick="addToCart('Caffè Espresso', 1.20)"><i class="fas fa-plus"></i> <i class="fas fa-shopping-cart"></i></button></td>
            </tr>
            <tr>
                <td><span class="nome-prod">Cappuccino</span></td>
                <td class="val-euro">1.50 €</td>
                <td>Caffetteria</td>
                <td><button class="btn-add" onclick="addToCart('Cappuccino', 1.50)"><i class="fas fa-plus"></i> <i class="fas fa-shopping-cart"></i></button></td>
            </tr>
            <tr>
                <td><span class="nome-prod">Cornetto Crema</span></td>
                <td class="val-euro">1.40 €</td>
                <td>Pastry</td>
                <td><button class="btn-add" onclick="addToCart('Cornetto Crema', 1.40)"><i class="fas fa-plus"></i> <i class="fas fa-shopping-cart"></i></button></td>
            </tr>
            <tr>
                <td><span class="nome-prod">Spremuta Arancia</span></td>
                <td class="val-euro">4.00 €</td>
                <td>Fresh</td>
                <td><button class="btn-add" onclick="addToCart('Spremuta Arancia', 4.00)"><i class="fas fa-plus"></i> <i class="fas fa-shopping-cart"></i></button></td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    let cart = [];
    let total = 0;

    function toggleCart() {
        document.getElementById('sidebar').classList.toggle('active');
    }

    function addToCart(name, price) {
        cart.push({name, price});
        updateCartUI();
        // Apre automaticamente il carrello al primo inserimento
        if(cart.length === 1) document.getElementById('sidebar').classList.add('active');
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartUI();
    }

    function updateCartUI() {
        const container = document.getElementById('cart-items-container');
        const totalDisplay = document.getElementById('total-price');
        container.innerHTML = '';
        total = 0;

        cart.forEach((item, index) => {
            total += item.price;
            container.innerHTML += `
                <div class="cart-item">
                    <span>${item.name}</span>
                    <div>
                        <span style="color: #ff0000">${item.price.toFixed(2)}€</span>
                        <button class="btn-remove" onclick="removeFromCart(${index})"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `;
        });

        totalDisplay.innerText = total.toFixed(2);
    }
</script>

</body>
</html>
