<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Sala Bar - Scuola Borsa Professional</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at center, #1a0000 0%, #000000 100%); 
            color: #ffffff; margin: 0; padding: 20px; min-height: 100vh;
            display: flex; gap: 20px; flex-wrap: wrap;
        }

        .container { flex: 3; min-width: 850px; }
        
        .comanda-box { 
            flex: 1; min-width: 300px; background: rgba(20, 0, 0, 0.95); 
            border: 2px solid #ff4444; border-radius: 20px; padding: 20px;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3); height: fit-content;
            position: sticky; top: 20px;
        }

        .header {
            text-align: center; padding: 20px; background: #000;
            border: 2px solid #00a6ff; border-radius: 20px; margin-bottom: 20px;
        }

        .header h1 { color: #00c8ff; margin: 0; font-size: 2.2em; letter-spacing: 5px; }
        .header .sub-title { font-size: 1em; color: #fff; opacity: 0.8; }

        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .filter-btn { 
            background: transparent; border: 1px solid #00a6ff; color: #00a6ff; 
            padding: 5px 15px; border-radius: 20px; cursor: pointer; font-size: 0.8em; transition: 0.3s;
        }
        .filter-btn.active { background: #00a6ff; color: #000; }

        .add-box {
            background: rgba(0,0,0,0.5); padding: 15px; border-radius: 15px; border: 1px solid #333;
            margin-bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
        }
        .add-box input { background: #000; border: 1px solid #00a6ff; color: #fff; padding: 8px; border-radius: 5px; width: 90px; }

        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { background: #00aaff; color: #000; padding: 12px; font-size: 0.75em; text-transform: uppercase; text-align: left; }
        
        .info-row td { 
            background: linear-gradient(90deg, #111 0%, #050505 100%);
            padding: 12px 15px; border-top: 1px solid #00a6ff; cursor: pointer; transition: 0.2s;
        }
        .info-row:hover td { background: #220000; border-color: #ff4444; }

        .desc-prodotto { display: block; color: #777; font-size: 0.75em; font-style: italic; margin-top: 3px; }

        .order-item { background: #111; border-left: 4px solid #ff4444; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .order-top { display: flex; justify-content: space-between; align-items: center; }
        
        .allergy-text { background: transparent; border: none; border-bottom: 1px solid #444; color: #00ffaa; font-size: 0.8em; width: 100%; outline: none; margin-top: 5px; }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7em; font-weight: bold; text-transform: uppercase; }
        .cat-badge { border: 1px solid #00a6ff; color: #00a6ff; }
        .stato-ok { color: #00ffaa; border: 1px solid #00ffaa; }
        .stato-no { color: #ff4444; border: 1px solid #ff4444; text-decoration: line-through; opacity: 0.5; }

        .btn-main { background: #00a6ff; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; color: #000; }
        
        /* Bottone azioni (Cestino menu) */
        .btn-action-del { 
            background: none; border: 1px solid #ff4444; color: #ff4444; 
            padding: 4px 8px; border-radius: 5px; cursor: pointer; transition: 0.3s;
        }
        .btn-action-del:hover { background: #ff4444; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SALA BAR</h1>
        <div class="sub-title">Scuola Borsa</div>
    </div>

    <div class="filter-bar" id="filtri"></div>

    <div class="add-box">
        <input type="text" id="n_in" placeholder="Prodotto" style="width:130px">
        <input type="text" id="d_in" placeholder="Descrizione" style="width:130px">
        <input type="text" id="c_in" placeholder="Categoria">
        <input type="number" id="co_in" placeholder="Costo" step="0.01">
        <input type="number" id="pr_in" placeholder="Prezzo" step="0.01">
        <input type="number" id="pi_in" placeholder="Interno" step="0.01">
        <button class="btn-main" onclick="aggiungiNuovo()">AGGIUNGI</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>PRODOTTO</th>
                <th>COSTO</th>
                <th>PREZZO</th>
                <th>INTERNO</th>
                <th>CATEGORIA</th>
                <th>STATO</th>
                <th>AZIONI</th>
            </tr>
        </thead>
        <tbody id="lista-menu"></tbody>
    </table>
</div>

<div class="comanda-box">
    <h2 style="color:#ff4444; text-align:center; margin-top:0;">COMANDA</h2>
    <div id="lista-ordine"></div>
    <div id="totale-ordine" style="text-align:right; font-weight:bold; border-top: 2px solid #ff4444; padding-top:15px; color:#fff; font-size: 1.5em;">0.00 €</div>
    <button onclick="svuotaComanda()" style="width: 100%; margin-top: 20px; background: #330000; border: 1px solid #ff4444; color: #ff4444; padding: 10px; cursor: pointer; border-radius: 5px; font-weight: bold;">CANCELLA ORDINE</button>
</div>

<script>
    let prodotti = [
        {n: "Caffè Espresso", d: "Miscela Arabica 100%", co: 0.15, pr: 1.20, pi: 1.00, c: "Caffetteria", st: "DISPONIBILE"},
        {n: "Cappuccino", d: "Latte Alta Qualità", co: 0.35, pr: 1.80, pi: 1.50, c: "Caffetteria", st: "DISPONIBILE"},
        {n: "Coca Cola", d: "Lattina 33cl", co: 0.60, pr: 2.50, pi: 2.00, c: "Bevande", st: "DISPONIBILE"},
        {n: "Cornetto", d: "Pasticceria Fresca", co: 0.50, pr: 1.50, pi: 1.20, c: "Dolci", st: "DISPONIBILE"},
        {n: "Panino Crudo", d: "Crudo Parma e Mozzarella", co: 1.50, pr: 4.50, pi: 4.00, c: "Salato", st: "ESAURITO"}
    ];

    let totale = 0;
    let filtroAttuale = "TUTTI";

    function renderFiltri() {
        const bar = document.getElementById('filtri');
        const cats = ["TUTTI", ...new Set(prodotti.map(p => p.c))];
        bar.innerHTML = cats.map(cat => `
            <button class="filter-btn ${filtroAttuale === cat ? 'active' : ''}" onclick="filtra('${cat}')">${cat}</button>
        `).join('');
    }

    function filtra(cat) { filtroAttuale = cat; renderMenu(); renderFiltri(); }

    function renderMenu() {
        const corpo = document.getElementById('lista-menu');
        corpo.innerHTML = "";
        prodotti.forEach((p, index) => {
            if (filtroAttuale !== "TUTTI" && p.c !== filtroAttuale) return;
            
            const sClass = p.st === "DISPONIBILE" ? "stato-ok" : "stato-no";
            const riga = document.createElement('tr');
            riga.className = "info-row";
            riga.onclick = () => { if(p.st === "DISPONIBILE") ordina(p.n, p.pr); };
            
            riga.innerHTML = `
                <td>
                    <b style="color:#00c8ff">${p.n}</b>
                    <span class="desc-prodotto">${p.d}</span>
                </td>
                <td style="color:#777">${p.co.toFixed(2)}€</td>
                <td style="font-weight:bold">${p.pr.toFixed(2)}€</td>
                <td style="color:#00a6ff">${p.pi.toFixed(2)}€</td>
                <td><span class="badge cat-badge">${p.c}</span></td>
                <td><span class="badge ${sClass}" ondblclick="event.stopPropagation(); cambiaStato(${index})">${p.st}</span></td>
                <td><button class="btn-action-del" onclick="event.stopPropagation(); eliminaDalMenu(${index})">🗑️</button></td>
            `;
            corpo.appendChild(riga);
        });
    }

    function ordina(nome, prezzo) {
        const lista = document.getElementById('lista-ordine');
        const id = 'ord-' + Date.now();
        const voce = document.createElement('div');
        voce.className = "order-item";
        voce.id = id;
        voce.innerHTML = `
            <div class="order-top">
                <span>${nome}</span>
                <b>${prezzo.toFixed(2)}€</b>
                <div>
                    <button style="color:#ffcc00" onclick="document.getElementById('note-${id}').focus()">✏️</button>
                    <button style="color:#ff4444" onclick="rimuoviDallaComanda('${id}', ${prezzo})">🗑️</button>
                </div>
            </div>
            <input type="text" id="note-${id}" class="allergy-text" placeholder="Istruzioni cliente...">
        `;
        lista.appendChild(voce);
        aggiornaCassa(prezzo);
    }

    function cambiaStato(idx) {
        prodotti[idx].st = prodotti[idx].st === "DISPONIBILE" ? "ESAURITO" : "DISPONIBILE";
        renderMenu();
    }

    function eliminaDalMenu(idx) {
        if(confirm("Vuoi davvero eliminare " + prodotti[idx].n + " dal menu?")) {
            prodotti.splice(idx, 1);
            renderFiltri();
            renderMenu();
        }
    }

    function aggiungiNuovo() {
        const n = document.getElementById('n_in').value;
        const d = document.getElementById('d_in').value || "";
        const c = document.getElementById('c_in').value || "Varie";
        const co = parseFloat(document.getElementById('co_in').value) || 0;
        const pr = parseFloat(document.getElementById('pr_in').value) || 0;
        const pi = parseFloat(document.getElementById('pi_in').value) || 0;
        if(!n) return;
        prodotti.push({n, d, co, pr, pi, c, st: "DISPONIBILE"});
        renderFiltri(); renderMenu();
        document.getElementById('n_in').value = ""; document.getElementById('d_in').value = "";
    }

    function rimuoviDallaComanda(id, pr) { document.getElementById(id).remove(); aggiornaCassa(-pr); }
    function aggiornaCassa(v) { totale += v; document.getElementById('totale-ordine').innerText = Math.abs(totale).toFixed(2) + " €"; }
    function svuotaComanda() { document.getElementById('lista-ordine').innerHTML = ""; totale = 0; aggiornaCassa(0); }

    window.onload = () => { renderMenu(); renderFiltri(); };
</script>
</body>
</html>
