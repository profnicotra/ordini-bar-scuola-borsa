<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menù V 3.0 TEST</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --neon-red: #ff3131;
        --neon-glow: rgba(255, 49, 49, 0.6);
        --bg-dark: #0a0a0a;
        --surface: rgba(10, 10, 10, 0.95);
        --error-color: #ff0000;
      }

      @keyframes bootSequence { 0% { opacity: 0; filter: brightness(0); transform: scale(1.05); } 100% { opacity: 1; filter: brightness(1); transform: scale(1); } }
      @keyframes slideIn { from { opacity: 0; transform: translateX(-30px); filter: blur(5px); } to { opacity: 1; transform: translateX(0); filter: blur(0); } }
      @keyframes modalOpen { from { opacity: 0; transform: scale(0.85); filter: blur(10px); } to { opacity: 1; transform: scale(1); filter: blur(0); } }
      @keyframes modalClose { from { opacity: 1; transform: scale(1); filter: blur(0); } to { opacity: 0; transform: scale(0.85); filter: blur(10px); } }
      @keyframes loadingBar { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }
      @keyframes fireGlow { 0% { box-shadow: 0 0 10px #ff0000, 0 0 20px #ff3131, 0 0 30px #ff7700; border-color: #ff3131; } 100% { box-shadow: 0 0 25px #ff0000, 0 0 45px #ff3131, 0 0 65px #ff7700; border-color: #ff7700; } }
      @keyframes spinLogo { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      body { font-family: "Rajdhani", sans-serif; background: var(--bg-dark); color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; animation: bootSequence 1.2s ease-out; }
      #boot-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease-in-out; }
      .loader-bar-container { width: 250px; height: 2px; background: #222; margin-top: 20px; }
      .loader-bar { height: 100%; background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); animation: loadingBar 1s forwards; }
      canvas#sparks { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 50% 50%, #2a0a0a 0%, #050505 100%); }

      .cyber-logo-container { position: absolute; top: 25px; left: 30px; width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--neon-red); background: rgba(10, 10, 10, 0.8); animation: fireGlow 1s infinite alternate; z-index: 1000; display: flex; justify-content: center; align-items: center; }
      .cyber-logo-img { width: 90%; height: 90%; border-radius: 50%; object-fit: contain; animation: spinLogo 15s linear infinite; }

      .container { width: 95%; max-width: 1200px; margin-top: 40px; z-index: 1; padding-bottom: 100px; }
      h1 { font-family: "Orbitron"; text-align: center; letter-spacing: 8px; text-shadow: 0 0 20px var(--neon-red); margin-bottom: 25px; color: white; }

      .category-nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
      .cat-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid #333; color: #888; padding: 12px 25px; font-family: "Orbitron"; font-size: 11px; cursor: pointer; transition: 0.3s; border-radius: 4px; animation: slideIn 0.5s both; }
      .cat-btn:hover { transform: translateY(-3px); color: white; border-color: var(--neon-red); }
      .cat-btn.active { border-color: var(--neon-red); color: var(--neon-red); box-shadow: 0 0 20px var(--neon-glow); background: rgba(255, 49, 49, 0.1); }

      .search-bar { width: 100%; max-width: 400px; margin: 0 auto 25px auto; display: block; text-align: center; border: 1px solid var(--neon-red); background: rgba(0, 0, 0, 0.5); transition: 0.3s; animation: slideIn 0.8s both; }
      .search-bar:focus { box-shadow: 0 0 15px var(--neon-glow); }

      .dashboard { background: var(--surface); border: 1px solid rgba(255, 49, 49, 0.3); border-radius: 8px; padding: 20px; box-shadow: 0 0 50px rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); margin-bottom: 40px; animation: modalOpen 0.8s both; }
      table { width: 100%; border-collapse: collapse; }
      .sortable-header { cursor: pointer; transition: 0.2s; user-select: none; }
      .sortable-header:hover { color: white; text-shadow: 0 0 10px var(--neon-red); }
      th { font-family: "Orbitron"; color: var(--neon-red); font-size: 10px; padding: 15px; text-align: left; border-bottom: 2px solid var(--neon-red); text-transform: uppercase; }
      td { padding: 15px; border-bottom: 1px solid #222; font-size: 16px; }
      .row-frame { animation: slideIn 0.4s both; }

      .notes-section { margin-top: 30px; border-top: 1px solid #333; padding-top: 20px; }
      .note-card { background: rgba(255, 255, 255, 0.02); border-left: 3px solid var(--neon-red); padding: 15px; margin-bottom: 15px; animation: slideIn 0.5s both; transition: transform 0.3s; display: flex; flex-direction: column; align-items: flex-start; }
      .note-card:hover { transform: scale(1.01) translateX(10px); background: rgba(255, 255, 255, 0.05); }
      .note-header { width: 100%; display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
      .note-list-container { width: 100%; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 4px; box-sizing: border-box; }
      .single-note { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding: 8px 0; font-size: 14px; }
      .single-note:last-child { border-bottom: none; }

      .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
      .modal.active { display: flex; } .modal.active .modal-content { animation: modalOpen 0.4s forwards; } .modal.closing .modal-content { animation: modalClose 0.3s forwards; }
      .modal-content { background: #0f0f0f; border: 2px solid var(--neon-red); padding: 30px; width: 420px; border-radius: 10px; position: relative; box-shadow: 0 0 40px rgba(255, 49, 49, 0.2); }
      .modal-conferma-box { width: 320px; text-align: center; }

      .input-error { border-color: var(--error-color) !important; box-shadow: 0 0 15px rgba(255, 0, 0, 0.5) !important; }
      .input-group { margin-bottom: 15px; } label { font-family: "Orbitron"; font-size: 9px; color: var(--neon-red); margin-bottom: 6px; display: block; }
      input[type="text"], input[type="number"], select { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 12px; font-family: "Rajdhani"; font-size: 16px; border-radius: 4px; outline: none; box-sizing: border-box; transition: 0.3s; }
      .checkbox-group { display: flex; gap: 15px; align-items: center; } .checkbox-group label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #ccc; cursor: pointer;} .checkbox-group input { width: auto; cursor: pointer; }

      .btn-plus-fixed { background: var(--neon-red); color: white; font-size: 28px; width: 60px; height: 60px; border-radius: 50%; position: fixed; bottom: 30px; right: 30px; box-shadow: 0 0 30px var(--neon-red); border: none; cursor: pointer; z-index: 100; transition: transform 0.3s; }
      .btn-plus-fixed:hover { transform: scale(1.2) rotate(90deg); }
      .btn { font-family: "Orbitron"; cursor: pointer; border: 1px solid var(--neon-red); background: transparent; color: var(--neon-red); padding: 6px 12px; font-size: 10px; border-radius: 3px; transition: 0.2s; }
      .btn:hover { background: var(--neon-red); color: white; box-shadow: 0 0 15px var(--neon-red); }
      .btn-blue { border-color: #00fff9; color: #00fff9; } .btn-blue:hover { background: #00fff9; box-shadow: 0 0 15px #00fff9; color: black; }
      .error-msg-box { color: var(--error-color); text-align: center; font-size: 11px; margin-bottom: 10px; font-family: "Orbitron"; min-height: 15px; }
    </style>
  </head>
  <body>
    <script id="backend-data" type="application/json">
        {
            "items": {% if data is defined and data['items'] is defined %}{{ data['items'] | tojson | safe }}{% else %}[]{% endif %},
            "note_groups": {% if data is defined and data['note_groups'] is defined %}{{ data['note_groups'] | tojson | safe }}{% else %}[]{% endif %}
        }
    </script>

    <div id="boot-loader">
        <div style="font-family: 'Orbitron'; color: var(--neon-red); letter-spacing: 5px;">INITIALIZING SYSTEM...</div>
        <div class="loader-bar-container"><div class="loader-bar"></div></div>
    </div>
    <canvas id="sparks"></canvas>
    
    <div class="cyber-logo-container">
        <img src="https://static.wixstatic.com/media/a24994_7448096f4def4357bb63b2ad620c6934~mv2.png" alt="Logo" class="cyber-logo-img">
    </div>

    <div class="container">
      <h1>MENÙ V 3.0 TEST</h1>
      
      <div class="category-nav">
        <button class="cat-btn active" style="animation-delay: 0.1s" onclick="filtra('CIBO', this)">CIBO</button>
        <button class="cat-btn" style="animation-delay: 0.2s" onclick="filtra('BEVANDE', this)">BEVANDE</button>
        <button class="cat-btn" style="animation-delay: 0.3s" onclick="filtra('SPECIALITÀ', this)">SPECIALITÀ</button>
      </div>
      
      <input type="text" id="searchInput" class="search-bar" placeholder="[ CERCA PRODOTTO PER NOME ]" oninput="render()" />

      <div class="dashboard">
        <table>
          <thead>
            <tr>
              <th class="sortable-header" onclick="toggleSort()">Prodotto <span id="sort-icon">⬇️</span></th>
              <th>Costo Unit.</th>
              <th>Listino €</th>
              <th>Margine</th>
              <th>Staff/Int.</th>
              <th style="text-align: right">SISTEMA</th>
            </tr>
          </thead>
          <tbody id="mainTable"></tbody>
        </table>
      </div>

      <div class="notes-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="font-family: 'Orbitron'; font-size: 14px; color: var(--neon-red); margin: 0;">[ GRUPPI NOTE / VARIANTI ]</h2>
            <button class="btn" onclick="apriModaleGruppo()">+ NUOVO GRUPPO</button>
        </div>
        <div id="notesContainer"></div>
      </div>
    </div>

    <button class="btn-plus-fixed" onclick="apriModale()">+</button>

    <div id="modal" class="modal">
      <div id="form-prodotto" class="modal-content">
        <h2 style="font-family: 'Orbitron'; color: white; margin-top: 0; letter-spacing: 2px;">GESTIONE PRODOTTO</h2>
        <div id="modal-error-msg" class="error-msg-box"></div>
        <input type="hidden" id="in-id" value="">

        <div class="input-group">
          <label>Nome Prodotto</label>
          <input type="text" id="in-nome" oninput="autoDetectCategory()" placeholder="Esempio: Pizza Margherita" />
        </div>
        
        <div style="display: flex; gap: 10px">
          <div class="input-group" style="flex:1"><label>Costo Acquisto (€)</label><input type="number" id="in-costo" step="0.01" min="0.01" oninput="calcola()" /></div>
          <div class="input-group" style="flex:1"><label>Prezzo Vendita (€)</label><input type="number" id="in-prezzo" step="0.01" min="0.01" oninput="calcola()" /></div>
        </div>
        <div style="display: flex; gap: 10px">
          <div class="input-group" style="flex: 1"><label>Margine Lordo</label><input type="text" id="in-margine" readonly style="color: #00ff00; font-weight: bold;" /></div>
          <div class="input-group" style="flex: 1"><label>Prezzo Staff (€)</label><input type="number" id="in-interni" step="0.01" min="0.01" /></div>
        </div>
        <div style="display: flex; gap: 10px">
          <div class="input-group" style="flex: 1"><label>Categoria</label><select id="in-categoria"><option value="CIBO">CIBO</option><option value="BEVANDE">BEVANDE</option><option value="SPECIALITÀ">SPECIALITÀ</option></select></div>
          <div class="input-group" style="flex: 1"><label>Disponibile (Attivo)</label><select id="in-attivo"><option value="SI">SI (Disponibile)</option><option value="NO">NO (Esaurito)</option></select></div>
        </div>
        
        <button class="btn" id="btn-salva-prodotto" style="width: 100%; padding: 15px; font-weight: bold; margin-top: 10px;" onclick="salva()">ESEGUI UPLOAD</button>
        <p onclick="chiudiModale('modal')" style="text-align: center; cursor: pointer; color: #444; margin-top: 15px; font-family: 'Orbitron'; font-size: 10px;">[ ANNULLA_OPERAZIONE ]</p>
      </div>
    </div>

    <div id="modal-gruppo" class="modal">
      <div id="modal-gruppo-box" class="modal-content">
        <h2 style="font-family: 'Orbitron'; color: white; margin-top: 0; letter-spacing: 2px;">GESTIONE GRUPPO NOTE</h2>
        <div id="modal-gruppo-error-msg" class="error-msg-box"></div>
        <input type="hidden" id="in-gruppo-id" value="">
        <div class="input-group"><label>Nome Gruppo</label><input type="text" id="in-gruppo-nome" /></div>
        <div class="input-group checkbox-group"><label><input type="checkbox" id="in-gruppo-esclusivo"> Scelta Esclusiva</label><label><input type="checkbox" id="in-gruppo-obbligatorio"> Scelta Obbligatoria</label></div>
        <button class="btn" id="btn-salva-gruppo" style="width: 100%; padding: 15px; font-weight: bold; margin-top: 10px;" onclick="salvaGruppo()">SALVA GRUPPO</button>
        <p onclick="chiudiModale('modal-gruppo')" style="text-align: center; cursor: pointer; color: #444; margin-top: 15px; font-size: 10px;">[ ANNULLA ]</p>
      </div>
    </div>

    <div id="modal-nota" class="modal">
      <div id="modal-nota-box" class="modal-content">
        <h2 style="font-family: 'Orbitron'; color: white; margin-top: 0; letter-spacing: 2px;">GESTIONE NOTA</h2>
        <input type="hidden" id="in-nota-id-gruppo" />
        <input type="hidden" id="in-nota-id" value="" />
        <div id="modal-nota-error-msg" class="error-msg-box"></div>
        <div class="input-group"><label>Testo della Nota</label><input type="text" id="in-nota-nome" /></div>
        <div class="input-group"><label>Variazione Prezzo (€)</label><input type="number" step="0.01" id="in-nota-prezzo" value="0" /></div>
        <button class="btn" id="btn-salva-nota" style="width: 100%; padding: 15px; font-weight: bold; margin-top: 10px;" onclick="salvaNota()">SALVA NOTA</button>
        <p onclick="chiudiModale('modal-nota')" style="text-align: center; cursor: pointer; color: #444; margin-top: 15px; font-size: 10px;">[ ANNULLA ]</p>
      </div>
    </div>

    <div id="modal-conferma" class="modal">
      <div class="modal-content modal-conferma-box">
        <h2 style="font-family: 'Orbitron'; color: var(--neon-red); margin-top: 0; letter-spacing: 2px;">ATTENZIONE</h2>
        <p id="testo-conferma" style="color: white; margin-bottom: 25px; font-size: 16px;">Sei sicuro di voler procedere?</p>
        <div style="display: flex; gap: 10px;">
          <button class="btn" style="flex: 1; padding: 12px; background: rgba(255,0,0,0.1);" onclick="eseguiConferma()">SI, PROCEDI</button>
          <button class="btn" style="flex: 1; padding: 12px; border-color: #555; color: #888;" onclick="chiudiModale('modal-conferma')">ANNULLA</button>
        </div>
      </div>
    </div>

    <script>
      // BOOT SEQUENCE & CANVAS ANIMATION
      window.addEventListener('load', () => { setTimeout(() => { const loader = document.getElementById('boot-loader'); loader.style.opacity = '0'; setTimeout(() => loader.style.display = 'none', 500); }, 1100); });
      const canvas = document.getElementById('sparks'); const ctx = canvas.getContext('2d'); let particles = [];
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } window.onresize = resize; resize();
      class Particle { constructor() { this.reset(); } reset() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2; this.speedY = Math.random() * 0.5 + 0.2; this.alpha = Math.random() * 0.5; } update() { this.y += this.speedY; if (this.y > canvas.height) this.reset(); } draw() { ctx.fillStyle = `rgba(255, 49, 49, ${this.alpha})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); } }
      for(let i=0; i<60; i++) particles.push(new Particle());
      function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); } animate();

      // CARICAMENTO E MAPPATURA DEI DATI DAL DATABASE
      let rawBackendData = { items: [], note_groups: [] };
      try { const el = document.getElementById('backend-data'); if(el && el.textContent.trim() !== "") { rawBackendData = JSON.parse(el.textContent); } } catch(e) { console.error("Errore parser backend", e); }
      
      let prodotti = [];
      if (rawBackendData.items && Array.isArray(rawBackendData.items)) {
          let uniqueProdotti = {};
          rawBackendData.items.forEach(item => {
              if (!uniqueProdotti[item.id]) {
                  uniqueProdotti[item.id] = {
                      id: item.id, nome: item.prodotto || "Senza Nome",
                      costo: item.costo ? parseFloat(item.costo) : 0, prezzo: item.prezzo_euro ? parseFloat(item.prezzo_euro) : 0, interni: item.prezzo_interni ? parseFloat(item.prezzo_interni) : 0,
                      categoria: item.categoria || "SPECIALITÀ", attivo: item.attivo ? "SI" : "NO"
                  };
              }
          });
          prodotti = Object.values(uniqueProdotti);
      }

      let gruppiNote = [];
      if (rawBackendData.note_groups && Array.isArray(rawBackendData.note_groups)) {
          gruppiNote = rawBackendData.note_groups.map(g => ({
              id: g.id_gruppo, nome: g.nome_gruppo, esclusivo: g.esclusivo, obbligatorio: g.obbligatorio_default,
              note: g.note ? g.note.map(n => ({ id: n.id, nome: n.nome, delta: n.price_delta_euro })) : []
          }));
      }

      let categoriaAttiva = "CIBO", sortAsc = true, azioneConfermata = null; 

      // FUNZIONI SUPPORTO UI
      function chiudiModale(id) { const modale = document.getElementById(id); modale.classList.add('closing'); setTimeout(() => { modale.classList.remove('active', 'closing'); }, 300); }
      function apriConferma(messaggio, callback) { document.getElementById("testo-conferma").innerText = messaggio; azioneConfermata = callback; document.getElementById("modal-conferma").classList.add("active"); }
      function eseguiConferma() { if (azioneConfermata) azioneConfermata(); chiudiModale('modal-conferma'); azioneConfermata = null; }
      function animazioneErrore(idBox) { const box = document.getElementById(idBox); box.style.boxShadow = "0 0 60px #ff0000"; setTimeout(() => { box.style.boxShadow = "0 0 40px rgba(255, 49, 49, 0.2)"; }, 500); }
      function contieneVolgarita(testo) { const testoLow = testo.toLowerCase(); const paroleBloccate = ["cazzo", "merda", "stronz", "puttan", "troia", "fanculo", "coglion", "bastard", "zoccola", "bestemmia", "dio", "madonn", "gesu", "cristo"]; return paroleBloccate.some(parola => testoLow.includes(parola)); }
      function toggleSort() { sortAsc = !sortAsc; document.getElementById("sort-icon").innerText = sortAsc ? "⬇️" : "⬆️"; render(); }
      function calcola() { const c = parseFloat(document.getElementById("in-costo").value) || 0; const p = parseFloat(document.getElementById("in-prezzo").value) || 0; const margEl = document.getElementById("in-margine"); if (p > 0) { margEl.value = Math.round(((p - c) / p) * 100) + "%"; } else { margEl.value = "0%"; } }
      function filtra(cat, btn) { categoriaAttiva = cat; document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active")); btn.classList.add("active"); render(); }
      function autoDetectCategory() { const nome = document.getElementById("in-nome").value.toLowerCase(), catSelect = document.getElementById("in-categoria"); const bevande = ["coca", "acqua", "birra", "vino", "the", "drink", "gin", "succo", "bibita"]; const cibo = ["pizza", "panino", "hamburger", "pasta", "fritto", "dolce", "kebab", "piadina"]; let detected = "SPECIALITÀ"; if (bevande.some(k => nome.includes(k))) detected = "BEVANDE"; else if (cibo.some(k => nome.includes(k))) detected = "CIBO"; catSelect.value = detected; }

      // ==========================================
      // CRUD PRODOTTI (DB COLLEGATO)
      // ==========================================
      function apriModale() { 
        document.getElementById("in-id").value = ""; 
        document.getElementById("modal-error-msg").innerText = ""; 
        document.querySelectorAll("#modal input[type='text'], #modal input[type='number']").forEach(i => { i.value = ""; i.classList.remove("input-error"); }); 
        document.querySelectorAll("#modal select").forEach(s => s.classList.remove("input-error")); 
        document.getElementById("in-categoria").value = categoriaAttiva; document.getElementById("in-attivo").value = "SI"; document.getElementById("in-margine").value = ""; 
        document.getElementById("modal").classList.add("active"); document.getElementById("in-nome").focus(); 
      }
      
      function modifica(id) { 
        document.getElementById("modal-error-msg").innerText = ""; 
        const p = prodotti.find(x => x.id === id); 
        document.getElementById("in-id").value = p.id; 
        document.getElementById("in-nome").value = p.nome; document.getElementById("in-costo").value = p.costo || 0; document.getElementById("in-prezzo").value = p.prezzo; document.getElementById("in-interni").value = p.interni; document.getElementById("in-categoria").value = p.categoria; document.getElementById("in-attivo").value = p.attivo; 
        document.querySelectorAll("input, select").forEach(i => i.classList.remove("input-error")); calcola(); 
        document.getElementById("modal").classList.add("active"); 
      }

      function duplica(id) {
        document.getElementById("modal-error-msg").innerText = ""; 
        const p = prodotti.find(x => x.id === id); 
        document.getElementById("in-id").value = ""; // Nuovo id
        document.getElementById("in-nome").value = p.nome + " (Copia)"; 
        document.getElementById("in-costo").value = p.costo || 0; document.getElementById("in-prezzo").value = p.prezzo; document.getElementById("in-interni").value = p.interni; document.getElementById("in-categoria").value = p.categoria; document.getElementById("in-attivo").value = p.attivo; 
        document.querySelectorAll("input, select").forEach(i => i.classList.remove("input-error")); calcola(); 
        document.getElementById("modal").classList.add("active"); 
      }

      function salva() {
        const elNome = document.getElementById("in-nome"), elCosto = document.getElementById("in-costo"), elPrezzo = document.getElementById("in-prezzo"), elInterni = document.getElementById("in-interni"), elAttivo = document.getElementById("in-attivo"), elErrorMsg = document.getElementById("modal-error-msg");
        [elNome, elCosto, elPrezzo, elInterni, elAttivo].forEach(el => el.classList.remove("input-error")); elErrorMsg.innerText = "";
        const nome = elNome.value.trim(), costo = parseFloat(elCosto.value), prezzo = parseFloat(elPrezzo.value), interni = parseFloat(elInterni.value), attivo = elAttivo.value;
        let hasError = false, errorText = "";

        if (!nome) { elNome.classList.add("input-error"); hasError = true; errorText = "Inserire il Nome Prodotto."; }
        if (!hasError && contieneVolgarita(nome)) { elNome.classList.add("input-error"); hasError = true; errorText = "ERRORE: LINGUAGGIO NON CONSENTITO"; }
        if (!hasError && (isNaN(costo) || costo < 0)) { elCosto.classList.add("input-error"); hasError = true; errorText = "Il costo non può essere negativo."; }
        if (!hasError && (isNaN(prezzo) || prezzo <= 0)) { elPrezzo.classList.add("input-error"); hasError = true; errorText = "Il prezzo deve essere un numero > 0."; }
        if (!hasError && (isNaN(interni) || interni <= 0)) { elInterni.classList.add("input-error"); hasError = true; errorText = "Il prezzo staff deve essere un numero > 0."; }
        if (!hasError) { if (costo > prezzo) { elCosto.classList.add("input-error"); elPrezzo.classList.add("input-error"); hasError = true; errorText = "ERRORE: Costo > Prezzo di Vendita!"; } else if (costo > interni) { elCosto.classList.add("input-error"); elInterni.classList.add("input-error"); hasError = true; errorText = "ERRORE: Costo > Prezzo Staff!"; } }
        
        if (hasError) { elErrorMsg.innerText = errorText; animazioneErrore("form-prodotto"); return; }

        const btn = document.getElementById('btn-salva-prodotto'); btn.innerText = "CARICAMENTO...";
        const data = { id: document.getElementById("in-id").value || null, nome: nome, costo: costo, prezzo: prezzo, interni: interni, categoria: document.getElementById("in-categoria").value, attivo: attivo };

        fetch('/admin/add_product', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
        .then(response => response.json()).then(result => {
            if(result.success) window.location.reload(); 
            else { btn.innerText = "ESEGUI UPLOAD"; elErrorMsg.innerText = "ERRORE SALVATAGGIO."; animazioneErrore("form-prodotto"); }
        }).catch(err => { btn.innerText = "ESEGUI UPLOAD"; elErrorMsg.innerText = "ERRORE DATABASE."; animazioneErrore("form-prodotto"); });
      }

      function elimina(id) { 
          apriConferma("TERMINARE RECORD PRODOTTO?", function() { 
              fetch('/admin/delete_product', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({id: id}) })
              .then(res => res.json()).then(result => { if(result.success) window.location.reload(); });
          }); 
      }

      // ==========================================
      // CRUD GRUPPI NOTE (DB COLLEGATO)
      // ==========================================
      function apriModaleGruppo() { document.getElementById("in-gruppo-id").value = ""; document.getElementById("modal-gruppo-error-msg").innerText = ""; document.getElementById("in-gruppo-nome").value = ""; document.getElementById("in-gruppo-nome").classList.remove("input-error"); document.getElementById("in-gruppo-esclusivo").checked = false; document.getElementById("in-gruppo-obbligatorio").checked = false; document.getElementById("modal-gruppo").classList.add("active"); }
      function modificaGruppo(id) {
          const g = gruppiNote.find(x => x.id === id);
          document.getElementById("in-gruppo-id").value = g.id; document.getElementById("modal-gruppo-error-msg").innerText = "";
          document.getElementById("in-gruppo-nome").value = g.nome; document.getElementById("in-gruppo-nome").classList.remove("input-error");
          document.getElementById("in-gruppo-esclusivo").checked = g.esclusivo; document.getElementById("in-gruppo-obbligatorio").checked = g.obbligatorio;
          document.getElementById("modal-gruppo").classList.add("active");
      }

      function salvaGruppo() { 
          const elNome = document.getElementById("in-gruppo-nome"), elError = document.getElementById("modal-gruppo-error-msg"); elNome.classList.remove("input-error"); elError.innerText = ""; 
          const nome = elNome.value.trim(), regexValido = /^[a-zA-ZÀ-ÿ\s']+$/; 
          if(!nome) { elNome.classList.add("input-error"); elError.innerText = "INSERIRE IL NOME DEL GRUPPO"; return; } 
          if(!regexValido.test(nome)) { elNome.classList.add("input-error"); elError.innerText = "ERRORE: NUMERI O SIMBOLI NON AMMESSI"; animazioneErrore("modal-gruppo-box"); return; } 
          if(contieneVolgarita(nome)) { elNome.classList.add("input-error"); elError.innerText = "ERRORE: LINGUAGGIO NON CONSENTITO"; animazioneErrore("modal-gruppo-box"); return; } 
          
          const btn = document.getElementById('btn-salva-gruppo'); btn.innerText = "CARICAMENTO...";
          const data = { 
              id: document.getElementById("in-gruppo-id").value || null, 
              nome: nome, esclusivo: document.getElementById("in-gruppo-esclusivo").checked, obbligatorio: document.getElementById("in-gruppo-obbligatorio").checked 
          };
          fetch('/admin/add_note_group', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) })
          .then(r => r.json()).then(res => { if(res.success) window.location.reload(); else { btn.innerText = "SALVA GRUPPO"; elError.innerText="Errore server"; animazioneErrore("modal-gruppo-box"); } });
      }
      
      function eliminaGruppo(id) { 
          apriConferma("CANCELLARE INTERO GRUPPO E LE SUE NOTE?", function() { 
              fetch('/admin/delete_note_group', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: id}) })
              .then(r=>r.json()).then(res=>{ if(res.success) window.location.reload(); });
          }); 
      }

      // ==========================================
      // CRUD SINGOLE NOTE (DB COLLEGATO)
      // ==========================================
      function apriModaleNota(idGruppo) { document.getElementById("in-nota-id-gruppo").value = idGruppo; document.getElementById("in-nota-id").value = ""; document.getElementById("modal-nota-error-msg").innerText = ""; document.getElementById("in-nota-nome").value = ""; document.getElementById("in-nota-nome").classList.remove("input-error"); document.getElementById("in-nota-prezzo").value = "0"; document.getElementById("modal-nota").classList.add("active"); }
      function modificaNota(idGruppo, idNota) {
          const g = gruppiNote.find(x => x.id === idGruppo);
          const n = g.note.find(x => x.id === idNota);
          document.getElementById("in-nota-id-gruppo").value = g.id; document.getElementById("in-nota-id").value = n.id;
          document.getElementById("modal-nota-error-msg").innerText = ""; document.getElementById("in-nota-nome").value = n.nome; document.getElementById("in-nota-nome").classList.remove("input-error");
          document.getElementById("in-nota-prezzo").value = n.delta; document.getElementById("modal-nota").classList.add("active");
      }

      function salvaNota() { 
          const elNome = document.getElementById("in-nota-nome"), elPrezzo = document.getElementById("in-nota-prezzo"), elError = document.getElementById("modal-nota-error-msg"); 
          elNome.classList.remove("input-error"); elError.innerText = ""; 
          const nome = elNome.value.trim(), prezzo = parseFloat(elPrezzo.value) || 0, regexValido = /^[a-zA-ZÀ-ÿ\s']+$/; 
          if(!nome) { elNome.classList.add("input-error"); elError.innerText = "INSERIRE TESTO DELLA NOTA"; return; } 
          if(!regexValido.test(nome)) { elNome.classList.add("input-error"); elError.innerText = "ERRORE: NUMERI O SIMBOLI NON AMMESSI"; animazioneErrore("modal-nota-box"); return; } 
          if(contieneVolgarita(nome)) { elNome.classList.add("input-error"); elError.innerText = "ERRORE: LINGUAGGIO NON CONSENTITO"; animazioneErrore("modal-nota-box"); return; } 
          
          const btn = document.getElementById('btn-salva-nota'); btn.innerText = "CARICAMENTO...";
          const data = { 
              id: document.getElementById("in-nota-id").value || null, 
              id_gruppo: document.getElementById("in-nota-id-gruppo").value, 
              nome: nome, prezzo: prezzo 
          };
          fetch('/admin/add_note', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) })
          .then(r => r.json()).then(res => { if(res.success) window.location.reload(); else { btn.innerText = "SALVA NOTA"; elError.innerText="Errore server"; animazioneErrore("modal-nota-box"); } });
      }

      function eliminaNota(id) { 
          apriConferma("ELIMINARE QUESTA SINGOLA NOTA?", function() { 
              fetch('/admin/delete_note', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: id}) })
              .then(r=>r.json()).then(res=>{ if(res.success) window.location.reload(); });
          }); 
      }

      // ==========================================
      // RENDER DELL'INTERFACCIA SULLA PAGINA
      // ==========================================
      function render() {
        const tableBody = document.getElementById("mainTable"), searchTerm = document.getElementById("searchInput").value.toLowerCase(); tableBody.innerHTML = "";
        let filtrati = prodotti.filter(p => p.categoria === categoriaAttiva && p.nome.toLowerCase().includes(searchTerm));
        filtrati.sort((a, b) => { const nomeA = a.nome.toLowerCase(), nomeB = b.nome.toLowerCase(); if (nomeA < nomeB) return sortAsc ? -1 : 1; if (nomeA > nomeB) return sortAsc ? 1 : -1; return 0; });
        
        filtrati.forEach((p, index) => {
          const delay = (index * 0.05).toFixed(2), pCosto = p.costo || 0, pPrezzo = p.prezzo || 0;
          const margineCalcolato = pPrezzo > 0 ? Math.round(((pPrezzo - pCosto) / pPrezzo) * 100) : 0;
          const colorNome = (p.attivo === "NO") ? "#888" : "#eee", tagEsaurito = (p.attivo === "NO") ? `<span style="color:var(--neon-red); font-size:9px; margin-left:5px;">[ ESAURITO ]</span>` : "";
          const tr = document.createElement("tr"); tr.className = "row-frame"; tr.style.animationDelay = `${delay}s`;
          
          tr.innerHTML = `
            <td><b style="color:${colorNome}">${p.nome}</b>${tagEsaurito}</td>
            <td style="color:#888">€${pCosto.toFixed(2)}</td>
            <td style="color:var(--neon-red); font-weight:bold; text-shadow: 0 0 10px var(--neon-glow)">€${pPrezzo.toFixed(2)}</td>
            <td style="color:#00ff00">${margineCalcolato}%</td>
            <td>€${(p.interni || 0).toFixed(2)}</td>
            <td style="text-align: right;">
              <button class="btn" onclick="modifica(${p.id})">MOD</button> 
              <button class="btn btn-blue" onclick="duplica(${p.id})">DUP</button>
              <button class="btn" style="border-color:#555; color:#888" onclick="elimina(${p.id})">X</button>
            </td>
          `;
          tableBody.appendChild(tr);
        });
        
        if(filtrati.length === 0) { tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #888;">Nessun prodotto trovato.</td></tr>`; }

        // STAMPA NOTE
        const notesContainer = document.getElementById("notesContainer"); notesContainer.innerHTML = "";
        if(gruppiNote.length === 0) { notesContainer.innerHTML = `<p style="color:#555; text-align:center; font-size:12px;">Nessun gruppo note configurato.</p>`; }
        gruppiNote.forEach((g, index) => {
            const delay = (index * 0.1).toFixed(2);
            let htmlNote = g.note.map(n => `
              <div class="single-note">
                <span>- ${n.nome} <span style="color:#aaa; font-size:12px;">(${n.delta > 0 ? '+' : ''}€${n.delta.toFixed(2)})</span></span> 
                <div>
                  <button class="btn" style="padding:2px 6px; font-size:9px;" onclick="modificaNota(${g.id}, ${n.id})">MOD</button>
                  <button class="btn" style="padding:2px 6px; font-size:9px; border-color:#444;" onclick="eliminaNota(${n.id})">X</button>
                </div>
              </div>`).join('');
            
            const div = document.createElement("div"); div.className = "note-card"; div.style.animationDelay = `${delay}s`;
            div.innerHTML = `
              <div class="note-header">
                <div>
                  <b style="font-size: 18px; letter-spacing: 1px; color:white;">${g.nome}</b>
                  <div style="font-size:10px; color:#888; margin-top:5px;">ESCLUSIVO: <span style="color:${g.esclusivo ? '#00ff00' : '#888'}">${g.esclusivo ? 'SI' : 'NO'}</span> | OBBLIGATORIO: <span style="color:${g.obbligatorio ? '#00ff00' : '#888'}">${g.obbligatorio ? 'SI' : 'NO'}</span></div>
                </div>
                <div>
                  <button class="btn" style="border-color: #00ff00; color: #00ff00;" onclick="apriModaleNota(${g.id})">+ NOTA</button> 
                  <button class="btn" style="border-color:#555; color:#888" onclick="modificaGruppo(${g.id})">MOD GRUPPO</button>
                  <button class="btn" style="border-color:#555; color:#888" onclick="eliminaGruppo(${g.id})">ELIMINA GRUPPO</button>
                </div>
              </div>
              <div class="note-list-container">${htmlNote || '<span style="color:#555; font-size:12px; font-style:italic;">Nessuna nota in questo gruppo. Clicca "+ NOTA" per aggiungerne.</span>'}</div>`;
            notesContainer.appendChild(div);
        });
      }
      window.onload = render;
    </script>
  </body>
</html>
