<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Admin Bar</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #007bff; color: white; cursor: pointer; }
        tr:hover { background: #f1f1f1; }
    </style>
</head>
<body>
    <h2>Gestione Prodotti Bar</h2>
    <input type="text" id="cerca" onkeyup="filtra()" placeholder="Cerca prodotto...">
    <table id="tabella">
        <thead>
            <tr>
                <th onclick="ordina(0)">Gruppo ↕</th>
                <th onclick="ordina(1)">Nome ↕</th>
                <th>Prezzo (€)</th>
            </tr>
        </thead>
        <tbody id="corpo">
            <tr><td>Caffetteria</td><td>Caffè</td><td>1.20</td></tr>
            <tr><td>Bevande</td><td>Coca Cola</td><td>2.50</td></tr>
            <tr><td>Dolci</td><td>Cornetto</td><td>1.30</td></tr>
        </tbody>
    </table>
    <script>
        function filtra() {
            let f = document.getElementById("cerca").value.toUpperCase();
            let tr = document.getElementById("corpo").rows;
            for (let i=0; i<tr.length; i++) {
                tr[i].style.display = tr[i].innerText.toUpperCase().includes(f) ? "" : "none";
            }
        }
        function ordina(n) {
            let t = document.getElementById("corpo");
            let r = Array.from(t.rows).sort((a,b) => a.cells[n].innerText.localeCompare(b.cells[n].innerText));
            r.forEach(row => t.appendChild(row));
        }
    </script>
</body>
</html>
