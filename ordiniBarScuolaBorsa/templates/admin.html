<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Gestionale Bar</title>

<style>

:root { --colore: red; }

@keyframes rgbCycle {
  0%   { --colore: #ff0000; }
  20%  { --colore: #ff00ff; }
  40%  { --colore: #0000ff; }
  60%  { --colore: #00ffff; }
  80%  { --colore: #00ff00; }
  100% { --colore: #ff0000; }
}

@keyframes glowBg {
  0% { background: radial-gradient(circle,#400000,#100000,#000); }
  50% { background: radial-gradient(circle,#200020,#000010,#000); }
  100% { background: radial-gradient(circle,#400000,#100000,#000); }
}

body {
  animation: rgbCycle 10s infinite linear, glowBg 5s infinite;
  font-family: Arial;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
  flex-direction:column;
}

/* COPERTINA */
#cover {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:black;
  z-index:999;
}

.titolo {
  font-size:60px;
  color: var(--colore);
  text-shadow:
    0 0 20px var(--colore),
    0 0 40px var(--colore),
    0 0 80px var(--colore);
  margin-bottom:40px;
}

#cover button {
  padding:15px 50px;
  font-size:20px;
  border:none;
  border-radius:40px;
  cursor:pointer;
  background:linear-gradient(135deg,var(--colore),black);
  color:white;
  box-shadow:
    0 0 10px var(--colore),
    0 0 30px var(--colore);
  transition:0.3s;
}

#cover button:hover {
  transform:scale(1.1);
}

@keyframes flicker {
  0%,100% { opacity:1; }
  50% { opacity:0.8; }
}

h1 {
  color: var(--colore);
  text-shadow:
    0 0 10px var(--colore),
    0 0 20px var(--colore),
    0 0 40px var(--colore);
  animation:flicker 2s infinite;
  text-align:center;
}

.menu {
  margin:20px 0;
  display:flex;
  justify-content:center;
  gap:10px;
}

@keyframes pulse {
  0% { box-shadow:0 0 10px var(--colore); }
  50% { box-shadow:0 0 30px var(--colore),0 0 60px var(--colore); }
  100% { box-shadow:0 0 10px var(--colore); }
}

.menu button {
  padding:12px 30px;
  font-size:16px;
  font-weight:bold;
  border:none;
  border-radius:30px;
  cursor:pointer;
  background:linear-gradient(135deg,var(--colore),black);
  color:white;
  animation:pulse 2s infinite;
  transition:0.3s;
}

.menu button:hover {
  transform:scale(1.1);
}

table {
  width:100%;
  border-collapse:collapse;
  background:black;
  border:1px solid var(--colore);
  box-shadow:
    0 0 10px var(--colore),
    0 0 20px var(--colore),
    0 0 40px var(--colore),
    0 0 80px var(--colore);
}

th, td {
  padding:15px;
  border:1px solid var(--colore);
  text-align:center;
}

.nome {
  color: var(--colore);
  text-shadow:0 0 10px var(--colore);
}

.si {
  color:lime;
  text-shadow:
    0 0 5px lime,
    0 0 10px lime,
    0 0 20px #00ff00,
    0 0 40px #00ff00;
}

.no {
  color:red;
  text-shadow:0 0 10px red;
}

.azioni button {
  padding:8px 20px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  background:linear-gradient(135deg,var(--colore),black);
  color:white;
  box-shadow:0 0 10px var(--colore);
}

</style>
</head>

<body>

<!-- COPERTINA -->
<div id="cover">
  <h1 class="titolo">GESTIONALE BAR</h1>
  <button onclick="entra()">ENTRA</button>
</div>

<h1>GESTIONALE BAR</h1>

<div class="container">

<div id="cibo">
<div class="menu">
<button onclick="mostra('cibo')">CIBO</button>
<button onclick="mostra('dolci')">DOLCI</button>
<button onclick="mostra('bibite')">BIBITE</button>
</div>
<table>
<thead>
<tr>
<th>NOME</th><th>COSTO</th><th>PREZZO</th><th>MARGINE</th><th>PREZZI INTERI</th><th>ATTIVO</th><th>AZIONI</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div id="dolci" style="display:none;">
<div class="menu">
<button onclick="mostra('cibo')">CIBO</button>
<button onclick="mostra('dolci')">DOLCI</button>
<button onclick="mostra('bibite')">BIBITE</button>
</div>
<table>
<thead>
<tr>
<th>NOME</th><th>COSTO</th><th>PREZZO</th><th>MARGINE</th><th>PREZZI INTERI</th><th>ATTIVO</th><th>AZIONI</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div id="bibite" style="display:none;">
<div class="menu">
<button onclick="mostra('cibo')">CIBO</button>
<button onclick="mostra('dolci')">DOLCI</button>
<button onclick="mostra('bibite')">BIBITE</button>
</div>
<table>
<thead>
<tr>
<th>NOME</th><th>COSTO</th><th>PREZZO</th><th>MARGINE</th><th>PREZZI INTERI</th><th>ATTIVO</th><th>AZIONI</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<script>

function entra(){
  document.getElementById("cover").style.display="none";
}

let pagina = "";
let ciboIndice = 0, dolciIndice = 0, bibiteIndice = 0;

// 🔥 doppio click bibite
let clickBibite = 0;
let timerBibite = null;

const prodotti = {
  cibo: [
    {nome:"PIZZETTE",costo:0.90,prezzo:1.60,attivo:true},
    {nome:"PATATINE",costo:0.50,prezzo:1.20,attivo:true},
    {nome:"TRAMEZZINO",costo:1.10,prezzo:2.10,attivo:false},
    {nome:"ARANCINI",costo:1.50,prezzo:3.00,attivo:true},
    {nome:"PANINO SALAME",costo:1.20,prezzo:2.50,attivo:true},
    {nome:"OLIVE ASCOLANE",costo:1.80,prezzo:4.00,attivo:false}
  ],
  dolci: [
    {nome:"CANNONCINI",costo:0.70,prezzo:1.50,attivo:true},
    {nome:"TIRAMISU",costo:0.80,prezzo:1.60,attivo:false},
    {nome:"CANNOLI",costo:1.00,prezzo:2.00,attivo:true},
    {nome:"CHEESECAKE",costo:1.00,prezzo:3.00,attivo:true},
    {nome:"PANNA COTTA",costo:0.70,prezzo:2.50,attivo:true},
    {nome:"TORTA FRUTTA",costo:1.20,prezzo:3.50,attivo:false}
  ],
  bibite: [
    {nome:"LEMON SODA",costo:0.60,prezzo:1.40,attivo:true},
    {nome:"GINGER",costo:0.50,prezzo:1.20,attivo:false},
    {nome:"COCA COLA",costo:0.80,prezzo:2.00,attivo:true},
    {nome:"THE FREDDO",costo:0.50,prezzo:1.50,attivo:true},
    {nome:"LATTE FRAPPE",costo:0.80,prezzo:2.00,attivo:true},
    {nome:"ORZO",costo:0.30,prezzo:1.00,attivo:false}
  ]
};

window.onload = () => mostra('cibo');

function mostra(id){

  // 🔥 doppio click su BIBITE → copertina
  if(id === "bibite"){
    clickBibite++;
    clearTimeout(timerBibite);

    timerBibite = setTimeout(() => clickBibite = 0, 600);

    if(clickBibite === 2){
      clickBibite = 0;
      document.getElementById("cover").style.display = "flex";
      return;
    }
  }

  pagina = id;

  document.getElementById("cibo").style.display="none";
  document.getElementById("dolci").style.display="none";
  document.getElementById("bibite").style.display="none";

  document.getElementById(id).style.display="block";

  aggiornaTabella();
}

function aggiornaTabella(){
  let tabella = document.querySelector("#"+pagina+" tbody");
  tabella.innerHTML="";

  let indice = pagina==="cibo"?ciboIndice:pagina==="dolci"?dolciIndice:bibiteIndice;
  let lista = prodotti[pagina];

  for(let i=0;i<3;i++){
    let realIndex = (indice+i)%lista.length;
    let prod = lista[realIndex];

    let riga = document.createElement("tr");
    riga.setAttribute("data-index", realIndex);

    riga.innerHTML = `
<td class="nome">${prod.nome}</td>
<td>${prod.costo.toFixed(2)}€</td>
<td>${prod.prezzo.toFixed(2)}€</td>
<td>${(prod.prezzo-prod.costo).toFixed(2)}€</td>
<td>${Math.round(prod.prezzo)}€</td>
<td class="${prod.attivo?'si':'no'}">${prod.attivo?'SI':'NO'}</td>
<td>
  <div class="azioni">
    <button onclick="modificaRiga(this)">Modifica</button>
    <button onclick="successivo()">Aggiorna</button>
  </div>
</td>
`;
    tabella.appendChild(riga);
  }
}

function modificaRiga(btn){
  let riga = btn.closest("tr");
  let index = riga.getAttribute("data-index");
  let prod = prodotti[pagina][index];

  let nuovoNome = prompt("Nome:", prod.nome);
  let nuovoCosto = prompt("Costo:", prod.costo);
  let nuovoPrezzo = prompt("Prezzo:", prod.prezzo);

  let costo = parseFloat(nuovoCosto);
  let prezzo = parseFloat(nuovoPrezzo);

  if(nuovoNome) prod.nome = nuovoNome;
  if(!isNaN(costo)) prod.costo = costo;
  if(!isNaN(prezzo)) prod.prezzo = prezzo;

  prod.attivo = confirm("Attivo?");

  aggiornaTabella();
}

function successivo(){
  if(pagina==="cibo"){ ciboIndice=(ciboIndice+3)%prodotti.cibo.length; }
  else if(pagina==="dolci"){ dolciIndice=(dolciIndice+3)%prodotti.dolci.length; }
  else { bibiteIndice=(bibiteIndice+3)%prodotti.bibite.length; }

  aggiornaTabella();
}

</script>

</body>
</html>
