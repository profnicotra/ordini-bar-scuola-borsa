<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Scuola Borsa - Pro Control V9</title>
    <link href="httpAs://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050505;
            --accent-red: #ff3c3c;
            --accent-green: #00ffaa;
            --text-main: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at top, #1a0808 0%, #050505 100%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            margin: 0; padding: 0;
            min-height: 100vh;
        }

        .scuola-borsa-bar {
            width: 100%; background: #000;
            border-top: 4px solid var(--accent-red);
            border-bottom: 1px solid #1a1a1a;
            padding: 20px 60px;
            display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box;
        }

        .brand-section { display: flex; align-items: center; gap: 25px; }
        .logo-container { 
            width: 90px; height: 90px; border-radius: 50%; 
            border: 3px solid var(--accent-red); background: #111;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }

        .brand-text .main { font-weight: 900; font-size: 1.8rem; letter-spacing: 3px; text-transform: uppercase; }

        .time-widget { display: flex; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid #222; padding: 12px 30px; border-radius: 40px; gap: 25px; }
        .status-pill { padding: 10px 22px; border-radius: 20px; font-size: 0.8rem; font-weight: 900; cursor: pointer; text-transform: uppercase; border: 1px solid transparent; transition: 0.3s; }
        .status-open { background: rgba(0, 255, 170, 0.1); color: var(--accent-green); border-color: var(--accent-green); }
        .status-closed { background: rgba(255, 60, 60, 0.1); color: var(--accent-red); border-color: var(--accent-red); }

        /* RIMOSSO IL BLOCCO 'is-closed' - ADESSO RESTA TUTTO NORMALE */

        .container { width: 100%; max-width: 1300px; padding: 40px 20px; margin: auto; box-sizing: border-box; }
        .nav-tabs { display: flex; gap: 12px; margin-bottom: 35px; }
        .tab-btn { flex: 1; padding: 18px; background: var(--glass); border: 1px solid var(--border); color: #666; font-weight: 700; cursor: pointer; border-radius: 12px; transition: 0.3s; }
        .tab-btn.active { background: var(--accent-red); color: white; border: none; box-shadow: 0 8px 20px rgba(255, 60, 60, 0.3); }

        .main-card { background: rgba(10, 10, 10, 0.95); border-radius: 20px; border: 1px solid var(--border); padding: 35px; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 12px; }
        th { text-transform: uppercase; font-size: 0.7rem; color: #555; padding: 10px; letter-spacing: 2px; text-align: left; }
        td { background: rgba(255,255,255,0.02); padding: 18px; vertical-align: middle; }

        .editable-input { background: transparent; border: none; color: white; width: 100%; outline: none; font-family: inherit; }
        
        .row-actions { display: flex; gap: 12px; justify-content: flex-end; align-items: center; }
        .btn-dispo { padding: 8px 15px; border-radius: 6px; font-size: 0.7rem; font-weight: 900; cursor: pointer; border: none; text-transform: uppercase; min-width: 60px; }
        .dispo-si { background: var(--accent-green); color: #000; }
        .dispo-no { background: var(--accent-red); color: #fff; }

        .btn-circle { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .btn-expand { background: #222; color: white; border: 1px solid #444; }
        .btn-delete { background: rgba(255, 60, 60, 0.1); color: var(--accent-red); border: 1px solid var(--accent-red); }

        .edit-row { display: none; background: #0a0a0a; padding: 30px; border-left: 5px solid var(--accent-red); border-radius: 0 0 15px 15px; margin-top: -12px; }
        .group-container { background: rgba(255,255,255,0.02); border: 1px solid #222; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        
        .gusti-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
        .gusto-item { background: #111; padding: 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; border: 1px solid #222; cursor: pointer; }
        .gusto-item.selected { border-color: var(--accent-green); background: rgba(0, 255, 170, 0.1); }
        
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; cursor: pointer; }
        .dot-si { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .dot-no { background: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); }

        .btn-selected-long {
            width: 100%; padding: 20px; margin-top: 20px;
            background: linear-gradient(90deg, #ff3c3c, #990000);
            color: white; border: none; border-radius: 12px;
            font-weight: 900; font-size: 1.1rem; letter-spacing: 4px; cursor: pointer; text-transform: uppercase;
        }

        .btn-action-small { background: #222; color: white; border: 1px solid #444; padding: 6px 12px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; }
    </style>
</head>

            <div class="brand-text"><div class="main">SCUOLA BORSA</div></div>
        </div>
        <div class="time-widget">
            <div id="live-clock" style="font-size: 1.4rem; font-weight: 900; margin-right:15px">00:00</div>
            <div id="shop-status" class="status-pill status-open" onclick="toggleShopStatus()">OPEN</div>
        </div>
    </header>

    <div class="container">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="changeTab('cibo', this)">MENU CIBO</button>
            <button class="tab-btn" onclick="changeTab('bevande', this)">BEVANDE</button>
            <button class="tab-btn" onclick="changeTab('dolci', this)">DOLCIARIA</button>
        </div>

        <div class="main-card">
            <div class="controls-header" style="display:flex; gap:20px; margin-bottom:30px">
                <input type="text" id="new-nome" placeholder="NOME NUOVO PRODOTTO..." class="editable-input" style="background:#000; padding:15px; border-radius:10px; border:1px solid #222; flex:1">
                <button onclick="aggiungiProdotto()" style="background:#fff; color:#000; border:none; padding:0 30px; border-radius:10px; font-weight:900; cursor:pointer;">AGGIUNGI +</button>
                <input type="text" id="search-input" placeholder="CERCA..." class="editable-input" style="background:#000; padding:15px; border-radius:10px; border:1px solid #222; width:300px" oninput="renderTable()">
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 30%;">Prodotto (A-Z)</th>
                        <th>Costo (€)</th>
                        <th>Prezzo (€)</th>
                        <th>P. Interni (€)</th>
                        <th>Margine (€)</th>
                        <th style="text-align: right;">Stato / Azioni</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        let currentTab = 'cibo';
        let database = { cibo: [], bevande: [], dolci: [] };
        let tempSelection = null;

        function toggleShopStatus() {
            const s = document.getElementById('shop-status');
            const isOpen = s.classList.contains('status-open');
            s.classList.toggle('status-open', !isOpen);
            s.classList.toggle('status-closed', isOpen);
            s.textContent = isOpen ? "CLOSED" : "OPEN";
            // RIMOSSO: document.body.classList.toggle('is-closed', isOpen);
        }

        function renderTable() {
            const body = document.getElementById('table-body');
            const search = document.getElementById('search-input').value.toLowerCase();
            body.innerHTML = '';
            
            database[currentTab].sort((a,b) => a.nome.localeCompare(b.nome));

            database[currentTab].forEach(p => {
                if(p.nome.toLowerCase().includes(search)) {
                    const margine = (p.prezzo - p.costo).toFixed(2);
                    
                    body.innerHTML += `
                        <tr>
                            <td><input type="text" class="editable-input" style="font-weight:700; color:var(--accent-red)" value="${p.nome}" onchange="updateVal(${p.id}, 'nome', this.value)"></td>
                            <td><input type="number" step="0.01" class="editable-input" value="${p.costo}" onchange="updateVal(${p.id}, 'costo', this.value)"></td>
                            <td><input type="number" step="0.01" class="editable-input" value="${p.prezzo}" onchange="updateVal(${p.id}, 'prezzo', this.value)"></td>
                            <td><input type="number" step="0.01" class="editable-input" value="${p.interni}" onchange="updateVal(${p.id}, 'interni', this.value)"></td>
                            <td style="color:var(--accent-green); font-weight:900;">${margine}€</td>
                            <td class="row-actions">
                                <button class="btn-dispo ${p.disponibile?'dispo-si':'dispo-no'}" onclick="toggleDispo(${p.id})">${p.disponibile?'SI':'NO'}</button>
                                <button class="btn-circle btn-expand" onclick="toggleEdit(${p.id})">+</button>
                                <button class="btn-circle btn-delete" onclick="eliminaProdotto(${p.id})">×</button>
                            </td>
                        </tr>
                        <tr><td colspan="6" style="padding:0; border:none"><div id="panel-${p.id}" class="edit-row">
                            <div style="display:flex; justify-content:space-between; margin-bottom:20px">
                                <h3 style="margin:0">GRUPPI E GUSTI</h3>
                                <button class="btn-action-small" onclick="aggiungiGruppo(${p.id})">+ GRUPPO</button>
                            </div>
                            <div id="groups-${p.id}">${renderGruppi(p)}</div>
                            <button class="btn-selected-long" onclick="confermaSelezione(${p.id})">SELEZIONATO</button>
                        </div></td></tr>`;
                }
            });
        }

        function renderGruppi(p) {
            return p.gruppi.map((g, gi) => `
                <div class="group-container">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px">
                        <input type="text" class="editable-input" style="font-weight:700; width:50%" value="${g.nome}" onchange="editG(${p.id}, ${gi}, this.value)">
                        <div>
                            <button class="btn-action-small" onclick="addGusto(${p.id}, ${gi})">+ GUSTO</button>
                            <button class="btn-action-small" style="color:red" onclick="delG(${p.id}, ${gi})">ELIMINA</button>
                        </div>
                    </div>
                    <div class="gusti-grid">${g.gusti.map((v, vi) => `
                        <div class="gusto-item ${tempSelection===v.id?'selected':''}" onclick="cliccaGusto(${p.id}, '${v.id}')">
                            <span class="dot ${v.disponibile?'dot-si':'dot-no'}" onclick="event.stopPropagation(); toggleV(${p.id},${gi},${vi})"></span>
                            <input type="text" class="editable-input" style="font-size:0.8rem; flex:1" value="${v.nome}" onchange="editV(${p.id},${gi},${vi},this.value)">
                            <span onclick="event.stopPropagation(); delV(${p.id},${gi},${vi})">×</span>
                        </div>`).join('')}</div>
                </div>`).join('');
        }

        function updateVal(id, field, val) {
            const p = database[currentTab].find(x => x.id === id);
            if(field === 'nome') {
                p.nome = val.toUpperCase() || "NUOVO";
            } else {
                let n = parseFloat(val);
                if(!n || n <= 0) { alert("Valore minimo 0.01!"); n = 0.01; }
                if(field === 'costo' && n > p.prezzo) alert("ATTENZIONE: Il costo supera il prezzo!");
                p[field] = n;
            }
            renderTable();
        }

        function cliccaGusto(pid, vid) {
            const p = database[currentTab].find(x => x.id === pid);
            let vObj; p.gruppi.forEach(g => { const found = g.gusti.find(x => x.id === vid); if(found) vObj = found; });
            if(vObj && !vObj.disponibile) { alert("SELEZIONE ERRATA: Opzione non disponibile!"); tempSelection = null; }
            else tempSelection = vid;
            renderTable(); toggleEdit(pid, true);
        }

        function confermaSelezione(pid) {
            if(!tempSelection) alert("SELEZIONE ERRATA: Scegli un gusto disponibile!");
            else { alert("PRODOTTO SELEZIONATO!"); tempSelection = null; renderTable(); }
        }

        function toggleDispo(id) { database[currentTab].find(x=>x.id===id).disponibile ^= 1; renderTable(); }
        function toggleV(pid, gi, vi) { 
            const v = database[currentTab].find(x=>x.id===pid).gruppi[gi].gusti[vi];
            v.disponibile ^= 1; if(!v.disponibile && tempSelection === v.id) tempSelection = null;
            renderTable(); toggleEdit(pid, true);
        }
        function aggiungiProdotto() {
            const n = document.getElementById('new-nome').value.trim().toUpperCase();
            if(!n) return;
            database[currentTab].push({id:Date.now(), nome:n, costo:0.01, prezzo:0.01, interni:0.01, disponibile:true, gruppi:[]});
            document.getElementById('new-nome').value = ''; renderTable();
        }
        function aggiungiGruppo(pid) { database[currentTab].find(x=>x.id===pid).gruppi.push({nome:"NUOVO GRUPPO", gusti:[]}); renderTable(); toggleEdit(pid, true); }
        function addGusto(pid, gi) { database[currentTab].find(x=>x.id===pid).gruppi[gi].gusti.push({id:"v"+Date.now(), nome:"Gusto", disponibile:true}); renderTable(); toggleEdit(pid, true); }
        function delG(pid, gi) { database[currentTab].find(x=>x.id===pid).gruppi.splice(gi,1); renderTable(); toggleEdit(pid, true); }
        function delV(pid, gi, vi) { database[currentTab].find(x=>x.id===pid).gruppi[gi].gusti.splice(vi,1); renderTable(); toggleEdit(pid, true); }
        function editG(pid, gi, val) { database[currentTab].find(x=>x.id===pid).gruppi[gi].nome = val.toUpperCase(); }
        function editV(pid, gi, vi, val) { database[currentTab].find(x=>x.id===pid).gruppi[gi].gusti[vi].nome = val; }
        function eliminaProdotto(id) { if(confirm("Eliminare?")) { database[currentTab] = database[currentTab].filter(x=>x.id!==id); renderTable(); } }
        
        function toggleEdit(id, open) {
            const p = document.getElementById(`panel-${id}`);
            if(!open) { const is = p.style.display==='block'; document.querySelectorAll('.edit-row').forEach(r=>r.style.display='none'); p.style.display=is?'none':'block'; }
            else p.style.display='block';
        }
        function changeTab(t, b) { currentTab=t; document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderTable(); }
        setInterval(() => { document.getElementById('live-clock').textContent = new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }, 1000);
        window.onload = renderTable;
    </script>
</body>
</html>
