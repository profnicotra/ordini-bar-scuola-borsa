<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione Palmare - Full Edit Mode</title>
    <style>
        body { background-color: #151952; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; color: rgb(25, 43, 124); }
        .container { width: 98%; max-width: 1500px; display: flex; flex-direction: column; gap: 20px; }
        .panel { background-color: rgb(15, 25, 109); padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgb(12, 32, 119); border: 1px solid #223392; }
        
        /* Form Aggiunta Prodotto */
        .add-product-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #444; }
        input, select { background: #cad0f3; border: 1px solid #444; color: rgb(14, 22, 95); padding: 8px; border-radius: 4px; box-sizing: border-box; width: 100%; }
        input[readonly] { background: #333; color: #aaa; cursor: not-allowed; }
        label { font-size: 0.7em; color: #ffffff; text-transform: uppercase; margin-bottom: 4px; display: block; }
        
        table { border-collapse: collapse; width: 100%; color: white; }
        th { color: #ffffff; padding: 12px; text-transform: uppercase; font-size: 0.75em; border-bottom: 1px solid #333; text-align: center; }
        td { padding: 15px 10px; text-align: center; border-bottom: 1px solid #222; font-size: 0.85em; }
        .text-left { text-align: left; }

        /* --- STILI PULSANTI AGGIORNATI --- */
        .btn { 
            padding: 8px 15px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            border: none; 
            text-transform: uppercase; 
            font-size: 0.7em; 
            background: transparent; 
            transition: all 0.2s ease-in-out; /* Transizione fluida per i colori */
        }
        
        .btn-add { 
            background-color: #102b61; 
            color: rgb(255, 255, 255); 
            border: 1px solid #ffffff;
        }
        .btn-add:hover {
            background-color: #122268;
            border-color: #ffffff;
        }

        .btn-note { 
            border: 1px solid #ffffff; 
            color: #ffffff; 
        }
        .btn-note:hover {
            background-color: #1a2252;
            color: white;
        }

        .btn-modifica { 
            border: 1px solid #ffffff; 
            color: #ffffff; 
            margin-left: 5px; 
        }
        .btn-modifica:hover {
            background-color: #0a0c66;
            color: white;
        }

        .btn-del { 
            border: 1px solid #555; 
            color: #ffffff; 
            margin-left: 5px; 
            padding: 8px 12px; 
        }
        .btn-del:hover {
            background-color: #183f88;
            border-color: #18338b;
            color: white;
        }
        
        /* POP-UP */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(35, 39, 94, 0.85); z-index: 999; }
        .modal-box { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background-color: #142b92; padding: 25px; border-radius: 8px; z-index: 1000; 
            width: 750px; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(7, 50, 143, 0.8);
            border: 1px solid #333;
        }
        
        .cat-section { margin-bottom: 15px; border-left: 3px solid #ffffff; padding-left: 15px; background: #ffffff; padding: 10px; border-radius: 0 8px 8px 0; }
        .cat-name { color: #ffffff; font-size: 0.75em; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
        .cat-delete-x { color: #fbfcfd; font-size: 1.5em; cursor: pointer; font-weight: bold; padding: 0 5px; transition: 0.2s; }
        .cat-delete-x:hover { color: #ffffff; transform: scale(1.1); }

        .note-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .note-btn { background-color: #17238f; color: white; padding: 6px 10px; border-radius: 4px; font-size: 0.8em; display: flex; align-items: center; gap: 8px; border: 1px solid transparent; }
        .note-delete-x { color: #ffffff; font-size: 1.2em; cursor: pointer; font-weight: bold; }

        .add-note-inline { display: flex; gap: 5px; margin-top: 5px; }
        
        .edit-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .edit-form-grid div.full-width { grid-column: span 2; }
        
        .add-category-row { display: flex; gap: 10px; margin-bottom: 20px; background: #112a7e; padding: 10px; border-radius: 6px; border: 1px dashed #444; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel">
        
        <table>
            <thead>
                <tr>
                    <th class="text-left">NOME</th>
                    <th>COSTO</th>
                    <th>PREZZO EURO</th>
                    <th>PREZZO INTERNI</th>
                    <th>MARGINE</th>
                    <th>ATTIVO</th>
                    <th>CATEGORIA</th>
                    <th>AZIONI</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <form class="add-product-form" style="margin-top: 20px; border-top: 1px solid #333; padding-top: 20px; border-bottom: none;" action="/admin/add_product" method="POST">
            <div>
                <label>Nome</label>
                <input type="text" name="nome_prodotto" id="newNome" placeholder="Nome" required>
            </div>
            <div>
                <label>Costo</label>
                <input type="number" name="costo" id="newCosto" step="0.01" placeholder="Costo" oninput="calcolaMargineNuovo()" required>
            </div>
            <div>
                <label>Prezzo €</label>
                <input type="number" name="prezzo_euro" id="newPrezzo" step="0.01" placeholder="Prezzo €" oninput="calcolaMargineNuovo()" required>
            </div>
            <div>
                <label>Interni</label>
                <input type="number" name="prezzo_interni" id="newInterni" step="0.01" placeholder="Interni" required>
            </div>
            <div>
                <label>Margine (Auto)</label>
                <input type="number" name="margine" id="newMargine" step="0.01" placeholder="Margine" readonly required>
            </div>
            <div>
                <label>Attivo</label>
                <select name="attivo" id="newAttivo">
                    <option value="si">Sì</option>
                    <option value="no">No</option>
                </select>
            </div>
            <div>
                <label>Categoria</label>
                <input type="text" name="categoria" id="newCategoria" placeholder="Categoria" required>
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button type="submit" class="btn btn-add" style="width: 100%; height: 35px;">AGGIUNGI</button>
            </div>
        </form>
    </div>
</div>

<div id="noteOverlay" class="overlay" onclick="chiudiNote()"></div>
<div id="noteBox" class="modal-box">
    <div style="font-size: 0.9em; margin-bottom:20px; border-bottom: 1px solid #333; padding-bottom: 10px;">
        GESTIONE VARIANTI PER: <span id="nTitoloNome" style="color:#2196F3; font-weight:bold;"></span>
    </div>
    
    <div class="add-category-row">
        <input type="text" id="nuovaCategoriaInput" placeholder="Nuova categoria (es. COTTURA, GUSTO...)" style="flex-grow: 1;">
        <button class="btn btn-add" style="background-color: #2196F3; border-color: #2196F3; white-space: nowrap;" onclick="aggiungiCategoria()">+ NUOVA CATEGORIA</button>
    </div>

    <div id="containerCategorie"></div>
    <button onclick="chiudiNote()" class="btn btn-add" style="width:100%; margin-top:20px; padding: 15px;">SALVA E ESCI</button>
</div>

<div id="editOverlay" class="overlay" onclick="chiudiModifica()"></div>
<div id="editBox" class="modal-box" style="width: 500px;">
    <div style="font-size: 0.9em; margin-bottom:20px; border-bottom: 1px solid #333; padding-bottom: 10px; color:#fffdfd; font-weight:bold;">
        MODIFICA PRODOTTO
    </div>
    <div class="edit-form-grid">
        <div class="full-width">
            <label>Nome Prodotto</label>
            <input type="text" id="editNome">
        </div>
        <div>
            <label>Costo</label>
            <input type="number" id="editCosto" step="0.01" oninput="calcolaMargineModifica()">
        </div>
        <div>
            <label>Prezzo Euro</label>
            <input type="number" id="editPrezzo" step="0.01" oninput="calcolaMargineModifica()">
        </div>
        <div>
            <label>Prezzo Interni</label>
            <input type="number" id="editInterni" step="0.01">
        </div>
        <div>
            <label>Margine (Auto)</label>
            <input type="number" id="editMargine" step="0.01" readonly>
        </div>
        <div>
            <label>Attivo</label>
            <select id="editAttivo">
                <option value="si">Sì</option>
                <option value="no">No</option>
            </select>
        </div>
        <div>
            <label>Categoria</label>
            <input type="text" id="editCategoria">
        </div>
    </div>
    <button onclick="salvaModificheProdotto()" class="btn btn-add" style="width:100%; margin-top:10px; padding: 15px;">SALVA MODIFICHE</button>
</div>

<script>
    // Carichiamo i dati inviati dal database tramite Jinja2 direttamente nella variabile globale listino
    let listino = {{ data['items'] | tojson | safe }};
    let prodottoCorrente = null;

    function formatNumber(num) {
        return parseFloat(num || 0).toString().replace('.', ',');
    }

    function calcolaMargineNuovo() {
        const costo = parseFloat(document.getElementById('newCosto').value) || 0;
        const prezzo = parseFloat(document.getElementById('newPrezzo').value) || 0;
        const margine = (prezzo - costo).toFixed(2);
        document.getElementById('newMargine').value = margine;
    }

    function calcolaMargineModifica() {
        const costo = parseFloat(document.getElementById('editCosto').value) || 0;
        const prezzo = parseFloat(document.getElementById('editPrezzo').value) || 0;
        const margine = (prezzo - costo).toFixed(2);
        document.getElementById('editMargine').value = margine;
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        listino.forEach(d => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-left">${d.n}</td>
                <td>${formatNumber(d.c)}</td>
                <td>${formatNumber(d.p)}</td>
                <td>${formatNumber(d.i)}</td>
                <td>${formatNumber(d.m)}</td>
                <td>${d.a}</td>
                <td>${d.g}</td>
                <td style="white-space: nowrap;">
                    <button class="btn btn-note" onclick='apriNote(${d.id})'>NOTE</button>
                    <button class="btn btn-modifica" onclick='apriModifica(${d.id})'>MODIFICA</button>
                    <button class="btn btn-del" onclick='eliminaProdotto(${d.id})'>X</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function eliminaProdotto(id) {
        if(confirm("Sei sicuro di voler eliminare definitivamente questo prodotto?")) {
            fetch(`/admin/delete_product/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    location.reload();
                } else {
                    alert("Errore durante l'eliminazione: " + data.error);
                }
            })
            .catch(error => console.error('Error:', error));
        }
    }

    function apriModifica(id) {
        prodottoCorrente = listino.find(p => p.id === id);
        if(!prodottoCorrente) return;
        
        document.getElementById('editNome').value = prodottoCorrente.n;
        document.getElementById('editCosto').value = prodottoCorrente.c;
        document.getElementById('editPrezzo').value = prodottoCorrente.p;
        document.getElementById('editInterni').value = prodottoCorrente.i;
        document.getElementById('editMargine').value = prodottoCorrente.m;
        document.getElementById('editAttivo').value = prodottoCorrente.a;
        document.getElementById('editCategoria').value = prodottoCorrente.g;

        document.getElementById('editOverlay').style.display = 'block';
        document.getElementById('editBox').style.display = 'block';
    }

    function salvaModificheProdotto() {
        if (!prodottoCorrente) return;

        const payload = {
            nome: document.getElementById('editNome').value,
            costo: document.getElementById('editCosto').value,
            prezzo_euro: document.getElementById('editPrezzo').value,
            prezzo_interni: document.getElementById('editInterni').value,
            margine: document.getElementById('editMargine').value,
            attivo: document.getElementById('editAttivo').value,
            categoria: document.getElementById('editCategoria').value
        };

        fetch(`/admin/edit_product/${prodottoCorrente.id}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            if(data.success) {
                chiudiModifica();
                location.reload();
            } else {
                alert("Errore durante la modifica: " + data.error);
            }
        })
        .catch(error => console.error('Error:', error));
    }

    function chiudiModifica() {
        document.getElementById('editOverlay').style.display = 'none';
        document.getElementById('editBox').style.display = 'none';
        prodottoCorrente = null;
    }

    function apriNote(id) {
        prodottoCorrente = listino.find(p => p.id === id);
        if(!prodottoCorrente) return;
        
        document.getElementById('nTitoloNome').innerText = prodottoCorrente.n.toUpperCase();
        document.getElementById('nuovaCategoriaInput').value = ''; 
        aggiornaUINote();
        document.getElementById('noteOverlay').style.display = 'block';
        document.getElementById('noteBox').style.display = 'block';
    }

    function aggiornaUINote() {
        const cont = document.getElementById('containerCategorie');
        cont.innerHTML = '';

        if (!prodottoCorrente.v) prodottoCorrente.v = {};

        for (const [categoria, note] of Object.entries(prodottoCorrente.v)) {
            const sezione = document.createElement('div');
            sezione.className = 'cat-section';
            
            sezione.innerHTML = `
                <div class="cat-name">
                    <span>${categoria}</span>
                    <span class="cat-delete-x" onclick="eliminaCategoria('${categoria}')" title="Elimina Categoria">&times;</span>
                </div>
                <div class="note-grid" id="grid-${categoria}"></div>
                <div class="add-note-inline">
                    <input type="text" id="input-${categoria}" placeholder="Nuova nota per ${categoria}...">
                    <button class="btn btn-add" style="background-color:#4CAF50; border-color:#4CAF50;" onclick="aggiungiNota('${categoria}')">+</button>
                </div>
            `;
            cont.appendChild(sezione);

            const grid = sezione.querySelector(`#grid-${categoria}`);
            note.forEach(nota => {
                const tag = document.createElement('div');
                tag.className = 'note-btn';
                tag.innerHTML = `
                    <span>${nota.toUpperCase()}</span>
                    <span class="note-delete-x" onclick="rimuoviNota('${categoria}', '${nota}')">&times;</span>
                `;
                grid.appendChild(tag);
            });
        }
    }

    function aggiungiCategoria() {
        const input = document.getElementById('nuovaCategoriaInput');
        let nomeCat = input.value.trim().toUpperCase();
        if(!nomeCat) return;
        if(!prodottoCorrente.v) prodottoCorrente.v = {};
        
        if(!prodottoCorrente.v[nomeCat]) {
            prodottoCorrente.v[nomeCat] = [];
            aggiornaUINote();
            input.value = ''; 
        } else {
            alert("Questa categoria esiste già per questo prodotto!");
        }
    }

    function eliminaCategoria(cat) {
        if(confirm(`Sei sicuro di voler eliminare l'intera categoria "${cat}" e tutte le sue note?`)) {
            delete prodottoCorrente.v[cat];
            aggiornaUINote();
        }
    }

    function aggiungiNota(cat) {
        const input = document.getElementById(`input-${cat}`);
        const valore = input.value.trim();
        if(!valore) return;
        if(!prodottoCorrente.v[cat].includes(valore)) {
            prodottoCorrente.v[cat].push(valore);
            aggiornaUINote();
        }
        input.value = '';
    }

    function rimuoviNota(cat, nota) {
        prodottoCorrente.v[cat] = prodottoCorrente.v[cat].filter(n => n !== nota);
        aggiornaUINote();
    }

    function chiudiNote() {
        document.getElementById('noteOverlay').style.display = 'none';
        document.getElementById('noteBox').style.display = 'none';
        prodottoCorrente = null;
    }

    // Avvia il rendering iniziale della tabella
    renderTable();
</script>

</body>
</html>
