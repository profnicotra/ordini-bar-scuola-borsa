<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione Sala - Scuola Borsa</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at center, #1a0000 0%, #000000 100%); color: #ffffff; margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { text-align: center; padding: 20px; background: #000; border: 2px solid #00a6ff; border-radius: 20px; margin-bottom: 20px; }
        .header h1 { color: #00c8ff; margin: 0; font-size: 2.2em; letter-spacing: 5px; text-shadow: 0 0 10px #00a6ff; }
        .search-container { margin-bottom: 20px; text-align: center; display: flex; justify-content: center; gap: 15px; }
        #searchBar { width: 100%; max-width: 400px; padding: 12px 20px; background: rgba(0,0,0,0.5); border: 2px solid #00a6ff; border-radius: 30px; color: #fff; outline: none; }
        .btn-sort { background: transparent; border: 2px solid #00a6ff; color: #00a6ff; padding: 0 25px; border-radius: 30px; font-weight: bold; cursor: pointer; line-height: 40px; }
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .filter-btn { background: transparent; border: 1px solid #444; color: #aaa; padding: 5px 15px; border-radius: 20px; cursor: pointer; }
        .filter-btn.active { border-color: #00a6ff; color: #00a6ff; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { background: #00aaff; color: #000; padding: 12px; text-transform: uppercase; text-align: left; }
        .info-row td { background: linear-gradient(90deg, #111 0%, #050505 100%); padding: 15px; border-top: 1px solid #00a6ff; }
        .badge { padding: 4px 10px; border-radius: 4px; font-size: 0.7em; font-weight: bold; }
        .stato-ok { color: #00ffaa; border: 1px solid #00ffaa; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>SALA BAR</h1><div style="opacity: 0.7;">Professional Database</div></div>
        <div class="search-container">
            <input type="text" id="searchBar" placeholder="Cerca prodotto...">
            <button class="btn-sort">Ordina A-Z ↓</button>
        </div>
        <div class="filter-bar">
            <button class="filter-btn active">TUTTI</button>
            <button class="filter-btn">Caffetteria</button>
            <button class="filter-btn">Dolce</button>
            <button class="filter-btn">Salato</button>
        </div>
        <table>
            <thead><tr><th>PRODOTTO</th><th>COSTO</th><th>PREZZO</th><th>INTERNO</th><th>CATEGORIA</th><th>STATO</th><th>AZIONI</th></tr></thead>
            <tbody>
                <tr class="info-row">
                    <td>Caffè Espresso</td><td>0.12</td><td>1.20</td><td>1.00</td>
                    <td><span class="badge" style="border:1px solid #00a6ff; color:#00a6ff">Caffetteria</span></td>
                    <td><span class="badge stato-ok">DISPONIBILE</span></td>
                    <td><button class="btn-sort" style="line-height:20px; padding:5px 10px">INFO</button></td>
                </tr>
                <tr class="info-row">
                    <td>Cornetto Crema</td><td>0.50</td><td>1.50</td><td>1.30</td>
                    <td><span class="badge" style="border:1px solid #00a6ff; color:#00a6ff">Dolce</span></td>
                    <td><span class="badge stato-ok">DISPONIBILE</span></td>
                    <td><button class="btn-sort" style="line-height:20px; padding:5px 10px">INFO</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
