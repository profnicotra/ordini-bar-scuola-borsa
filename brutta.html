<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <style>
        /* SFONDO NERO E CENTRATURA */
        body { 
            margin: 0; padding: 40px; 
            background: #0a0a0a; /* Nero profondo */
            font-family: 'Montserrat', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            color: #fdfaf6;
        }

        h1 {
            color: #d3a27f; /* Oro/Marrone chiaro */
            font-size: 50px; text-transform: uppercase;
            letter-spacing: 5px; margin-bottom: 30px;
            border-bottom: 5px solid #4e342e; padding-bottom: 10px;
            text-shadow: 0 0 20px rgba(211, 162, 127, 0.2);
        }

        /* Barra per aggiungere - Versione Dark */
        .add-box {
            background: #1a1a1a; padding: 20px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px; display: flex; gap: 10px;
            width: 90%; max-width: 1300px; justify-content: center;
            border: 1px solid #333;
        }

        .add-box input, .add-box select {
            padding: 12px; border: 1px solid #444; border-radius: 10px;
            background: #222; color: white; outline: none;
        }

        .btn-add {
            background: #d3a27f; color: #1a1a1a; border: none;
            padding: 10px 25px; border-radius: 10px; cursor: pointer;
            font-weight: bold; transition: 0.3s;
        }
        .btn-add:hover { background: #b88a68; transform: scale(1.05); }

        /* Tabella Grande su Sfondo Nero */
        .container { width: 90%; max-width: 1300px; animation: slideUp 1s ease-out; }

        table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            background: #111111; border-radius: 20px; overflow: hidden;
            box-shadow: 0 25px 70px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }

        th {
            background: #4e342e; color: #ffffff; padding: 25px;
            text-align: left; font-size: 14px; text-transform: uppercase;
        }

        td { padding: 20px 25px; border-bottom: 1px solid #222; color: #ddd; font-size: 17px; }

        /* Effetto hover scuro */
        tr:hover td { background: #1a1512; color: #fff; transition: 0.3s; }

        /* Cestino Nero/Grigio Scuro */
        .btn-del {
            background: #000; color: #d3a27f; border: 1px solid #333;
            padding: 8px 12px; border-radius: 8px; cursor: pointer;
        }
        .btn-del:hover { background: #d3a27f; color: #000; }

        .status { padding: 8px 16px; border-radius: 30px; font-weight: bold; font-size: 12px; }
        .fresco { background: #1b2e1b; color: #4caf50; }
        .esaurito { background: #000; color: #666; border: 1px solid #333; }

        .margine { color: #d3a27f; font-weight: 900; font-size: 20px; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>☕ BAR SCUOLA BORSA</h1>

    <div class="add-box">
        <input type="text" id="n" placeholder="Prodotto">
        <input type="text" id="c" placeholder="Categoria">
        <input type="number" id="co" placeholder="Costo €" step="0.01">
        <input type="number" id="pr" placeholder="Prezzo €" step="0.01">
        <select id="st">
            <option value="DISPONIBILE">DISPONIBILE</option>
            <option value="ESAURITO">ESAURITO</option>
        </select>
        <button class="btn-add" onclick="aggiungiManuale()">AGGIUNGI +</button>
    </div>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>Prodotto</th>
                    <th>Categoria</th>
                    <th>Costo</th>
                    <th>Prezzo</th>
                    <th>Margine</th>
                    <th>Stato</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody id="lista">
                <!-- Caricati via script -->
            </tbody>
        </table>
    </div>

    <script>
        const prodottiIniziali = [
            {n: "Cornetto Crema", c: "Lievitati", co: 0.45, pr: 1.50, st: "DISPONIBILE"},
            {n: "Cappuccino Arabica", c: "Caffetteria", co: 0.30, pr: 1.80, st: "DISPONIBILE"},
            {n: "Caffè Espresso", c: "Caffetteria", co: 0.15, pr: 1.20, st: "DISPONIBILE"},
            {n: "Spremuta Arancia", c: "Bevande", co: 0.90, pr: 3.50, st: "ESAURITO"},
            {n: "Muffin Cioccolato", c: "Dolci", co: 0.60, pr: 2.20, st: "DISPONIBILE"},
            {n: "Tramezzino Tonno", c: "Salato", co: 1.10, pr: 3.50, st: "DISPONIBILE"},
            {n: "Pasticciotto", c: "Dolci", co: 0.70, pr: 2.00, st: "DISPONIBILE"},
            {n: "Te caldo Limone", c: "Bevande", co: 0.20, pr: 2.50, st: "DISPONIBILE"},
            {n: "Focaccia Bianca", c: "Salato", co: 0.50, pr: 2.50, st: "DISPONIBILE"},
            {n: "Succo di Frutta", c: "Bevande", co: 0.60, pr: 2.50, st: "DISPONIBILE"}
        ];

        function inserisciInTabella(nome, cat, costo, prezzo, stato) {
            const marg = prezzo > 0 ? (((prezzo - costo) / prezzo) * 100).toFixed(0) : 0;
            const sClass = stato === "DISPONIBILE" ? "fresco" : "esaurito";
            
            const riga = document.createElement('tr');
            riga.innerHTML = `
                <td><b style="color:white">${nome}</b></td>
                <td>${cat}</td>
                <td>${costo.toFixed(2)} €</td>
                <td>${prezzo.toFixed(2)} €</td>
                <td class="margine">${marg}%</td>
                <td><span class="status ${sClass}">${stato}</span></td>
                <td><button class="btn-del" onclick="this.parentElement.parentElement.remove()">🗑️</button></td>
            `;
            document.getElementById('lista').appendChild(riga);
        }

        function aggiungiManuale() {
            const nome = document.getElementById('n').value;
            const cat = document.getElementById('c').value;
            const costo = parseFloat(document.getElementById('co').value) || 0;
            const prezzo = parseFloat(document.getElementById('pr').value) || 0;
            const stato = document.getElementById('st').value;

            if(!nome) return alert("Inserisci il nome!");
            inserisciInTabella(nome, cat, costo, prezzo, stato);

            document.getElementById('n').value = "";
            document.getElementById('co').value = "";
            document.getElementById('pr').value = "";
        }

        window.onload = () => {
            prodottiIniziali.forEach(p => inserisciInTabella(p.n, p.c, p.co, p.pr, p.st));
        };
    </script>
</body>
</html>
