<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Scuola Bar Borsa - Cyber Edition</title>
    <style>
        /* STILE PRINCIPALE */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at center, #1a0000 0%, #000000 100%); 
            color: #ffffff; margin: 0; padding: 40px 20px; min-height: 100vh;
        }
        .container { max-width: 1400px; margin: auto; }
        .header {
            text-align: center; padding: 30px; background: linear-gradient(145deg, #1a0000 0%, #000000 100%);
            border: 2px solid #00a6ff; border-radius: 20px; margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 166, 255, 0.3);
        }
        h1 { color: #00c8ff; margin: 0; text-transform: uppercase; letter-spacing: 6px; font-size: 2.5em; text-shadow: 0 0 15px #00c8ff; }
        
        /* Box Aggiungi */
        .add-box {
            background: rgba(0, 0, 0, 0.8); padding: 20px; border-radius: 15px;
            border: 1px solid #333; margin-bottom: 30px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
        }
        .add-box input, .add-box select { background: #000; border: 1px solid #00a6ff; color: white; padding: 10px; border-radius: 5px; outline: none; }
        
        .btn-add {
            background: #00a6ff; color: black; border: none; padding: 10px 25px;
            border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-add:hover { background: #00ffaa; box-shadow: 0 0 20px #00ffaa; transform: scale(1.05); }

        /* Tabella */
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        th { background: #00aaff; color: #000; padding: 15px; text-align: left; text-transform: uppercase; font-size: 0.8em; border-radius: 5px; }
        td { background: linear-gradient(90deg, #111 0%, #050505 100%); padding: 15px; border-top: 1px solid #00a6ff; border-bottom: 1px solid #00a6ff; }
        tr:hover td { border-color: #ff0000; background: linear-gradient(90deg, #220000 0%, #111 100%); }
        td:first-child { border-left: 1px solid #00a6ff; border-radius: 12px 0 0 12px; }
        td:last-child { border-right: 1px solid #00a6ff; border-radius: 0 12px 12px 0; }

        .nome-prod { font-weight: bold; color: #00c8ff; font-size: 1.1em; }
        .val-margine { color: #00ffaa; font-weight: bold; }
        .btn-del { background: #000; color: #ff4444; border: 1px solid #ff4444; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SCUOLA <span style="color:#fff">BAR</span> BORSA</h1>
    </div>

    <div class="add-box">
        <input type="text" id="n" placeholder="Nome Prodotto">
        <input type="text" id="c" placeholder="Categoria">
        <input type="number" id="co" placeholder="Costo €" step="0.01">
        <input type="number" id="pr" placeholder="Prezzo €" step="0.01">
        <select id="st">
            <option value="DISPONIBILE">DISPONIBILE</option>
            <option value="ESAURITO">ESAURITO</option>
        </select>
        <button class="btn-add" onclick="aggiungiEApriSchermo()">ORDINA & AGGIUNGI +</button>
    </div>

    <table id="tabella">
        <thead>
            <tr>
                <th>PRODOTTO</th>
                <th>CATEGORIA</th>
                <th>COSTO</th>
                <th>PREZZO</th>
                <th>MARGINE</th>
                <th>STATO</th>
                <th>AZIONI</th>
            </tr>
        </thead>
        <tbody id="lista"></tbody>
    </table>
</div>

<script>
    function aggiungiEApriSchermo() {
        const nome = document.getElementById('n').value;
        const cat = document.getElementById('c').value;
        const costo = parseFloat(document.getElementById('co').value) || 0;
        const prezzo = parseFloat(document.getElementById('pr').value) || 0;
        const stato = document.getElementById('st').value;

        if(!nome) return alert("Inserisci il nome del prodotto!");

        // 1. Aggiunge alla tabella principale
        const marg = (prezzo - costo).toFixed(2);
        const riga = document.createElement('tr');
        riga.innerHTML = `
            <td><span class="nome-prod">${nome}</span></td>
            <td>${cat}</td>
            <td>${costo.toFixed(2)} €</td>
            <td>${prezzo.toFixed(2)} €</td>
            <td class="val-margine">+${marg} €</td>
            <td>${stato}</td>
            <td><button class="btn-del" onclick="this.parentElement.parentElement.remove()">🗑️</button></td>
        `;
        document.getElementById('lista').appendChild(riga);

        // 2. APRE LA SCHERMATA CON LO STESSO STILE
        const monitor = window.open("", "_blank", "width=800,height=500");
        monitor.document.write(`
            <html>
            <head>
                <title>Monitor Preparazione</title>
                <style>
                    body { 
                        background: radial-gradient(circle at center, #1a0000 0%, #000000 100%); 
                        color: #ffffff; font-family: 'Segoe UI', sans-serif; 
                        display: flex; flex-direction: column; align-items: center; justify-content: center; 
                        height: 100vh; margin: 0; overflow: hidden;
                    }
                    .box { 
                        border: 3px solid #00a6ff; padding: 50px; border-radius: 30px; 
                        text-align: center; box-shadow: 0 0 40px rgba(0, 166, 255, 0.5); 
                        background: rgba(0,0,0,0.8); animation: pulse 2s infinite;
                    }
                    h1 { color: #00c8ff; font-size: 4em; margin: 0; text-transform: uppercase; letter-spacing: 5px; text-shadow: 0 0 20px #00c8ff; }
                    h2 { color: #ffffff; font-size: 3em; margin-top: 20px; border-bottom: 2px solid #ff0000; padding-bottom: 10px; }
                    .footer { margin-top: 30px; color: #555; letter-spacing: 2px; font-weight: bold; }
                    @keyframes pulse {
                        0% { transform: scale(1); box-shadow: 0 0 40px rgba(0, 166, 255, 0.5); }
                        50% { transform: scale(1.02); box-shadow: 0 0 60px rgba(0, 166, 255, 0.8); }
                        100% { transform: scale(1); box-shadow: 0 0 40px rgba(0, 166, 255, 0.5); }
                    }
                </style>
            </head>
            <body>
                <div class="box">
                    <h1>IN PREPARAZIONE</h1>
                    <h2>${nome.toUpperCase()}</h2>
                    <div class="footer">SCUOLA BAR BORSA - KITCHEN MONITOR</div>
                </div>
                <script>
                    setTimeout(() => { window.close(); }, 5000);
                <\/script>
            </body>
            </html>
        `);

        // Pulisce i campi
        document.getElementById('n').value = "";
        document.getElementById('co').value = "";
        document.getElementById('pr').value = "";
    }
</script>

</body>
</html>
