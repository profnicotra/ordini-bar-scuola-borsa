<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Scuola Bar Borsa - Progetto Gruppo 2</title>
    <style>
        /* STILE RED & BLACK */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at center, #1a0000 0%, #000000 100%); 
            color: #ffffff; 
            margin: 0; padding: 40px 20px; min-height: 100vh;
        }
        .container { max-width: 1400px; margin: auto; }
        
        .header {
            text-align: center; padding: 40px;
            background: linear-gradient(145deg, #ff0000 0%, #000000 100%);
            border: 2px solid #ff0000; border-radius: 20px; margin-bottom: 40px;
            box-shadow: 0 0 25px rgb(153, 35, 35);
        }
        h1 { color: #ff0000; text-transform: uppercase; letter-spacing: 6px; font-size: 3em; margin: 0; }

        .menu-nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .nav-btn {
            padding: 15px 40px; font-size: 1.1em; font-weight: bold; text-transform: uppercase;
            background: transparent; border: 2px solid #ff0000; color: #ff0000; border-radius: 12px;
            cursor: pointer; transition: 0.3s;
        }
        .nav-btn.active { background: #ff0000; color: #000; box-shadow: 0 0 15px #ff0000; }

        .tabella-sezione { display: none; width: 100%; border-collapse: separate; border-spacing: 0 15px; }
        .tabella-sezione.active { display: table; animation: fadeIn 0.4s; }

        th { background: #ff0000; color: #000; padding: 18px; text-align: left; text-transform: uppercase; border-radius: 12px; }
        td { background: #111; padding: 20px; border: 1px solid #ff0000; border-radius: 12px; }

        .nome-prod { font-weight: bold; color: #ff0000; font-size: 1.2em; }
        .input-note { background: #000; border: 1px solid #ff0000; color: white; padding: 8px; border-radius: 5px; width: 70%; }
        .btn-salva { background: #ff0000; color: #000; border: none; padding: 8px 12px; font-weight: bold; cursor: pointer; border-radius: 5px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SCUOLA <span style="color:#fff">BAR</span> BORSA</h1>
        <div style="color:#888; letter-spacing: 3px;">GRUPPO 2 - GESTIONE NOTE</div>
    </div>

    <!-- GRUPPI DI NOTE -->
    <div class="menu-nav">
        <button class="nav-btn active" onclick="mostraSezione('caffetteria', event)">Caffetteria</button>
        <button class="nav-btn" onclick="mostraSezione('dolce', event)">Dolce</button>
        <button class="nav-btn" onclick="mostraSezione('salato', event)">Salato</button>
    </div>

    <!-- TABELLE NOTE (Task: Aggiungere note e gruppi alla tabella) -->
    <table id="caffetteria" class="tabella-sezione active">
        <thead><tr><th>Prodotto</th><th>Costo</th><th>Note (Database)</th></tr></thead>
        <tbody id="body-caffetteria"></tbody>
    </table>

    <table id="dolce" class="tabella-sezione">
        <thead><tr><th>Prodotto</th><th>Costo</th><th>Note (Database)</th></tr></thead>
        <tbody id="body-dolce"></tbody>
    </table>

    <table id="salato" class="tabella-sezione">
        <thead><tr><th>Prodotto</th><th>Costo</th><th>Note (Database)</th></tr></thead>
        <tbody id="body-salato"></tbody>
    </table>
</div>

<script>
    // 1. MOCKUP DATI (Task: Modello per gestire gruppi e note)
    const datiNote = {
        caffetteria: [
            { id: "esp", nome: "Caffè Espresso", costo: "1.20€" },
            { id: "gin", nome: "Caffè Ginseng", costo: "1.80€" }
        ],
        dolce: [
            { id: "cor", nome: "Cornetto Crema", costo: "1.40€" }
        ],
        salato: [
            { id: "foc", nome: "Focaccia Crudo", costo: "5.50€" }
        ]
    };

    // 2. VISUALIZZAZIONE DATI REALI (Task: Far comparire i dati reali)
    function renderizza() {
        for (let categoria in datiNote) {
            const tbody = document.getElementById('body-' + categoria);
            tbody.innerHTML = datiNote[categoria].map(item => `
                <tr>
                    <td><span class="nome-prod">${item.nome}</span></td>
                    <td>${item.costo}</td>
                    <td>
                        <input type="text" id="input-${item.id}" class="input-note" placeholder="Inserisci nota...">
                        <button class="btn-salva" onclick="salva('${item.id}')">OK</button>
                    </td>
                </tr>
            `).join('');

            // Carica note dal database locale
            datiNote[categoria].forEach(item => {
                const salvata = localStorage.getItem('nota-' + item.id);
                if(salvata) document.getElementById('input-' + item.id).value = salvata;
            });
        }
    }

    // 3. FUNZIONE DATABASE (Task: Inserire i dati delle note nel database)
    function salva(id) {
        const testo = document.getElementById('input-' + id).value;
        localStorage.setItem('nota-' + id, testo);
        alert("Nota salvata nel database!");
    }

    // Navigazione
    function mostraSezione(id, e) {
        document.querySelectorAll('.tabella-sezione').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
    }

    // Esegui al caricamento (Task: Testare sulla propria macchina)
    window.onload = renderizza;
</script>

</body>
</html>
